<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tým · SC Scouting</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <p style="margin:0 0 10px"><a href="/">← Všechny týmy</a></p>
    <section id="hero" class="team-hero compact"></section>

    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="active">Přehled</button>
      <button data-tab="drafts">Hry a drafty <span class="count" id="draft-count"></span></button>
      <button data-tab="vods">VODky</button>
      <button data-tab="notes">Poznámky</button>
    </nav>

    <section class="tab-panel" data-panel="overview">
      <div class="section-head">
        <h2>Soupiska</h2>
        <button class="btn btn-primary btn-small" id="add-player">+ Přidat hráče</button>
      </div>
      <div id="roster" class="roster-compact"></div>

      <div class="section-head" style="margin-top:22px">
        <h2>Poslední hry</h2>
        <button class="btn btn-small" data-goto="drafts">Všechny →</button>
      </div>
      <div id="recent" class="drow-list"></div>
    </section>

    <section class="tab-panel" data-panel="drafts" hidden>
      <div id="drafts" class="drow-list"></div>
    </section>

    <section class="tab-panel" data-panel="vods" hidden>
      <div id="team-vods" class="vod-grid"></div>
    </section>

    <section class="tab-panel" data-panel="notes" hidden>
      <div id="team-notes" class="notes" style="margin:0"></div>
    </section>
  </main>

  <dialog id="team-dialog">
    <form>
      <h2>Upravit tým</h2>
      <div class="form-grid">
        <div class="full"><label>Název *</label><input name="name" required maxlength="80"></div>
        <div><label>Tag</label><input name="tag" maxlength="10"></div>
        <div><label>Turnaj / sezóna</label><input name="tournament" maxlength="100"></div>
        <div><label>Barva týmu</label><input name="accent_color" type="color"></div>
        <div class="full"><label>Logo URL</label><input name="logo_url" type="url" placeholder="https://…"></div>
        <div class="full"><label class="check"><input type="checkbox" name="is_own_team"> Tohle je náš tým</label></div>
        <div class="full"><label>Poznámky</label><textarea name="notes"></textarea></div>
      </div>
      <p class="form-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-cancel>Zrušit</button>
        <button type="submit" class="btn btn-primary">Uložit</button>
      </div>
    </form>
  </dialog>

  <dialog id="player-dialog">
    <form>
      <h2 data-title>Hráč</h2>
      <div class="form-grid">
        <div><label>Přezdívka *</label><input name="nickname" required maxlength="60"></div>
        <div><label>Role</label>
          <select name="role">
            <option value="">—</option>
            <option value="TOP">Top</option><option value="JUNGLE">Jungle</option><option value="MID">Mid</option>
            <option value="ADC">ADC</option><option value="SUPPORT">Support</option><option value="SUB">Náhradník</option>
          </select>
        </div>
        <div class="full"><label>Riot ID (herní jméno – podle něj se páruje s drafty)</label><input name="riot_id" placeholder="Jméno#TAG"></div>
        <div><label>Twitch</label><input name="twitch_login" placeholder="login nebo odkaz"></div>
        <div><label>Kick</label><input name="kick_slug" placeholder="kanál nebo odkaz"></div>
        <div class="full"><label>Štítky (oddělené čárkou)</label><input name="tags" placeholder="comfort picks, agresivní, tiltuje"></div>
        <div class="full"><label>Poznámky</label><textarea name="notes"></textarea></div>
      </div>
      <p class="form-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-cancel>Zrušit</button>
        <button type="submit" class="btn btn-primary">Uložit</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { api, esc, initPage, formDialog, logoHtml, ROLE_LABELS, loadChampions, champIcon, draftRow } from '/app.js';

    await initPage('teams');
    const teamId = new URLSearchParams(location.search).get('id');
    let team, players = [], drafts = [], icons = new Map(), live = {}, editingPlayer = null;

    // --- tabs ---------------------------------------------------------------
    const tabs = document.getElementById('tabs');
    function showTab(name) {
      for (const b of tabs.querySelectorAll('button')) b.classList.toggle('active', b.dataset.tab === name);
      for (const p of document.querySelectorAll('.tab-panel')) p.hidden = p.dataset.panel !== name;
      history.replaceState(null, '', `?id=${teamId}${name === 'overview' ? '' : `#${name}`}`);
      if (name === 'vods') loadVods();
    }
    tabs.addEventListener('click', (e) => e.target.closest('button[data-tab]') && showTab(e.target.closest('button').dataset.tab));
    document.addEventListener('click', (e) => e.target.dataset.goto && showTab(e.target.dataset.goto));

    // --- per-player stats from drafts -----------------------------------------
    function statsFor(playerId) {
      let games = 0, wins = 0, losses = 0;
      const champs = new Map();
      for (const d of drafts) {
        const a = d.actions.find((x) => x.action === 'PICK' && x.player_id === playerId);
        if (!a) continue;
        games++;
        champs.set(a.champion, (champs.get(a.champion) || 0) + 1);
        if (d.result) {
          const win = (a.side === 'ALLY') === (d.result === 'WIN');
          win ? wins++ : losses++;
        }
      }
      return { games, wins, losses, top: [...champs.entries()].sort((x, y) => y[1] - x[1]).slice(0, 4) };
    }

    function wrHtml(w, l) {
      if (!w && !l) return '<span class="muted">–</span>';
      const wr = Math.round((w / (w + l)) * 100);
      return `<span class="wr ${wr >= 55 ? 'good' : wr < 45 ? 'bad' : ''}">${w}V ${l}P · ${wr} %</span>`;
    }

    // --- rendering -------------------------------------------------------------
    function renderHero() {
      const ours = new Set(players.map((p) => p.id));
      let w = 0, l = 0;
      for (const d of drafts) {
        if (!d.result) continue;
        const onAlly = d.actions.some((a) => a.side === 'ALLY' && ours.has(a.player_id)) || ours.has(d.pov_player_id);
        ((d.result === 'WIN') === onAlly) ? w++ : l++;
      }
      document.getElementById('hero').innerHTML = `
        ${logoHtml(team)}
        <div class="info">
          <h1>${esc(team.name)} ${team.is_own_team ? '<span class="badge badge-own">Náš tým</span>' : ''}</h1>
          <div class="meta">
            ${team.tag ? `<span>[${esc(team.tag)}]</span>` : ''}
            ${team.tournament ? `<span>${esc(team.tournament)}</span>` : ''}
            <span>${drafts.length} her</span>
            ${w + l ? `<span class="record"><span class="w">${w} V</span> / <span class="l">${l} P</span></span>` : ''}
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-small" id="edit-team">Upravit</button>
          <button class="btn btn-small btn-danger" id="delete-team">Smazat</button>
        </div>`;
      document.getElementById('edit-team').onclick = () => teamDialog.open({ ...team, accent_color: team.accent_color || '#c8a64b' });
      document.getElementById('delete-team').onclick = async () => {
        if (!confirm(`Smazat tým ${team.name}? Hráči zůstanou v databázi bez týmu.`)) return;
        await api(`/api/teams/${teamId}`, { method: 'DELETE' });
        location.href = '/';
      };
    }

    function renderRoster() {
      const el = document.getElementById('roster');
      el.innerHTML = players.length
        ? players.map((p) => {
            const s = statsFor(p.id);
            const channel = p.twitch_login
              ? `<span class="chip chip-twitch">${live[p.twitch_login] ? '<span class="live-dot"></span>LIVE' : '<span class="dot"></span>'}${esc(p.twitch_login)}</span>`
              : p.kick_slug ? `<span class="chip chip-kick"><span class="dot"></span>${esc(p.kick_slug)}</span>` : '';
            return `
            <a class="rcard" href="/player?id=${p.id}">
              <div class="tools">
                <button class="btn btn-small" data-edit="${p.id}">Upravit</button>
                <button class="btn btn-small btn-danger" data-delete="${p.id}">✕</button>
              </div>
              <div class="top">
                <div class="role role-${esc(p.role || '')}">${ROLE_LABELS[p.role] || '—'}</div>
                <div><h3>${esc(p.nickname)}</h3><div class="sub">${p.riot_id ? esc(p.riot_id) : 'Riot ID nevyplněné'}</div></div>
              </div>
              <div class="line"><span>${s.games} her</span>${wrHtml(s.wins, s.losses)}</div>
              <div class="line">
                <span class="strip" style="display:flex;gap:3px">${s.top.map(([c, n]) => `<span title="${esc(c)}: ${n}×">${champIcon(icons, c, 'row')}</span>`).join('') || '<span class="muted">zatím žádné hry</span>'}</span>
                ${channel}
              </div>
            </a>`;
          }).join('')
        : '<div class="empty" style="grid-column:1/-1">Tým zatím nemá žádné hráče.</div>';
    }

    function renderDrafts() {
      const ours = new Set(players.map((p) => p.id));
      document.getElementById('draft-count').textContent = drafts.length ? `(${drafts.length})` : '';
      const empty = '<div class="empty">Zatím žádné hry. Čtečka je doplní z VODek hráčů, nebo je přidá Claude přes konektor.</div>';
      document.getElementById('recent').innerHTML = drafts.length ? drafts.slice(0, 5).map((d) => draftRow(d, icons, ours)).join('') : empty;
      document.getElementById('drafts').innerHTML = drafts.length ? drafts.map((d) => draftRow(d, icons, ours)).join('') : empty;
    }

    function renderNotes() {
      document.getElementById('team-notes').textContent = team.notes || 'Žádné poznámky. Přidáš je přes „Upravit“.';
    }

    let vodsLoaded = false;
    async function loadVods() {
      if (vodsLoaded) return;
      vodsLoaded = true;
      const { vods } = await api(`/api/vods?team_id=${teamId}&limit=24`);
      document.getElementById('team-vods').innerHTML = vods.length
        ? vods.map((v) => `
          <a class="vod" href="${esc(v.url)}" target="_blank" rel="noopener">
            <div class="thumb">${v.thumbnail_url ? `<img src="${esc(v.thumbnail_url)}" alt="" loading="lazy">` : ''}</div>
            <div class="body">
              <div class="title">${esc(v.title || 'Bez názvu')}</div>
              <div class="sub">${esc(v.player_nickname || v.channel_login)} · ${new Date(v.started_at).toLocaleDateString('cs-CZ')}${v.draft_count ? ` · ${v.draft_count} her` : ''}</div>
            </div>
          </a>`).join('')
        : '<div class="empty" style="grid-column:1/-1">Zatím žádné VODky. Doplň hráčům Twitch kanál.</div>';
    }

    async function load() {
      ({ team, players } = await api(`/api/teams/${teamId}`));
      document.title = `${team.name} · SC Scouting`;
      document.body.style.setProperty('--accent', team.accent_color || '#c8a64b');
      [{ drafts }, icons] = await Promise.all([api(`/api/drafts?team_id=${teamId}&limit=100`), loadChampions()]);
      renderHero();
      renderRoster();
      renderDrafts();
      renderNotes();
    }

    // --- dialogs -------------------------------------------------------------
    const teamDialog = formDialog(document.getElementById('team-dialog'), {
      async onSubmit(values) {
        await api(`/api/teams/${teamId}`, { method: 'PUT', body: values });
        await load();
      },
    });
    const playerDialogEl = document.getElementById('player-dialog');
    const playerDialog = formDialog(playerDialogEl, {
      async onSubmit(values) {
        if (editingPlayer) await api(`/api/players/${editingPlayer}`, { method: 'PUT', body: values });
        else await api(`/api/teams/${teamId}/players`, { method: 'POST', body: values });
        await load();
      },
    });
    document.getElementById('add-player').onclick = () => {
      editingPlayer = null;
      playerDialogEl.querySelector('[data-title]').textContent = 'Nový hráč';
      playerDialog.open({});
    };
    document.getElementById('roster').addEventListener('click', async (e) => {
      const editId = e.target.dataset.edit, deleteId = e.target.dataset.delete;
      if (!editId && !deleteId) return;
      e.preventDefault();
      const p = players.find((x) => String(x.id) === (editId || deleteId));
      if (editId) {
        editingPlayer = p.id;
        playerDialogEl.querySelector('[data-title]').textContent = `Upravit: ${p.nickname}`;
        playerDialog.open({ ...p, tags: p.tags.join(', ') });
      } else if (confirm(`Smazat hráče ${p.nickname}?`)) {
        await api(`/api/players/${p.id}`, { method: 'DELETE' });
        await load();
      }
    });

    api('/api/live').then((r) => { live = r.twitch; if (players.length) renderRoster(); }).catch(() => {});
    load()
      .then(() => { const h = location.hash.slice(1); if (h) showTab(h); })
      .catch((err) => {
        document.querySelector('main').innerHTML = `<div class="empty">${esc(err.message)}<br><br><a href="/">Zpět na týmy</a></div>`;
      });
  </script>
</body>
</html>
