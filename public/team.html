<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tým · SGooBovo šedl scouting</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <style>
    .opgg-row { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
    .opgg-mini { font: 700 0.66rem var(--display); letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; background: #5c46e8; color: #fff; }
    .opgg-mini:hover { text-decoration: none; filter: brightness(1.15); }
  </style>
</head>
<body>
  <main class="team-page">
    <p class="back"><a href="/">← Všechny týmy</a></p>

    <div class="tp-head">
      <div class="tp-title" id="hero"></div>
      <div class="tp-tools">
        <div class="gseg" id="type-filter" role="group" aria-label="Typ her"></div>
        <button class="btn btn-small btn-ghost" id="edit-team">Upravit tým</button>
        <button class="btn btn-small btn-ghost btn-danger" id="delete-team">Smazat</button>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="active">Statistiky</button>
      <button data-tab="champions">Championi <span class="count" id="champ-count"></span></button>
      <button data-tab="drafts">Hry a drafty <span class="count" id="draft-count"></span></button>
      <button data-tab="vods">VODky</button>
      <button data-tab="notes">Poznámky</button>
    </nav>

    <section class="tab-panel" data-panel="overview">
      <div class="gboxes">
        <section class="gbox"><h2>Tým</h2><table class="gtable kv" id="summary"></table></section>
        <section class="gbox"><h2>Nejčastěji banují</h2><table class="gtable kv" id="bans-by"></table></section>
        <section class="gbox"><h2>Banují proti nim</h2><table class="gtable kv" id="bans-vs"></table></section>
      </div>

      <section class="gbox" id="ban-box">
        <h2>Návrh banů <span class="muted" style="font:500 .8rem var(--font);text-transform:none;letter-spacing:0">z draftů ve VODkách, champion poolů z koučingu a ranku hráčů</span></h2>
        <div class="gscroll"><table class="gtable" id="ban-suggest"></table></div>
      </section>

      <section class="gbox">
        <h2>Hráči <button class="btn btn-small" id="add-player">+ Přidat hráče</button></h2>
        <div class="gscroll"><table class="gtable" id="players"></table></div>
      </section>

      <section class="gbox">
        <h2>Poslední zápasy <button class="btn btn-small" data-goto="drafts">Všechny hry →</button></h2>
        <div class="gscroll"><table class="gtable" id="recent"></table></div>
      </section>
    </section>

    <section class="tab-panel" data-panel="champions" hidden>
      <section class="gbox">
        <h2>Championi týmu <span class="gseg" id="champ-roles" role="group" aria-label="Role"></span></h2>
        <div class="gscroll"><table class="gtable" id="champs"></table></div>
      </section>
    </section>

    <section class="tab-panel" data-panel="drafts" hidden>
      <div id="drafts" class="drow-list"></div>
    </section>

    <section class="tab-panel" data-panel="vods" hidden>
      <div id="team-vods" class="vod-grid"></div>
    </section>

    <section class="tab-panel" data-panel="notes" hidden>
      <div id="team-notes" class="notes" style="margin:0"></div>
    </section>
  </main>

  <dialog id="team-dialog">
    <form>
      <h2>Upravit tým</h2>
      <div class="form-grid">
        <div class="full"><label>Název *</label><input name="name" required maxlength="80"></div>
        <div><label>Tag</label><input name="tag" maxlength="10"></div>
        <div><label>Turnaj / sezóna</label><input name="tournament" maxlength="100"></div>
        <div><label>Barva týmu</label><input name="accent_color" type="color"></div>
        <div class="full"><label>Logo URL</label><input name="logo_url" type="url" placeholder="https://…"></div>
        <div class="full"><label class="check"><input type="checkbox" name="is_own_team"> Tohle je náš tým</label></div>
        <div class="full"><label>Poznámky</label><textarea name="notes"></textarea></div>
      </div>
      <p class="form-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-cancel>Zrušit</button>
        <button type="submit" class="btn btn-primary">Uložit</button>
      </div>
    </form>
  </dialog>

  <dialog id="player-dialog">
    <form>
      <h2 data-title>Hráč</h2>
      <div class="form-grid">
        <div><label>Přezdívka *</label><input name="nickname" required maxlength="60"></div>
        <div><label>Role</label>
          <select name="role">
            <option value="">—</option>
            <option value="TOP">Top</option><option value="JUNGLE">Jungle</option><option value="MID">Mid</option>
            <option value="ADC">ADC</option><option value="SUPPORT">Support</option><option value="SUB">Náhradník</option>
          </select>
        </div>
        <div class="full"><label>Riot ID (herní jméno – podle něj se páruje s drafty)</label><input name="riot_id" placeholder="Jméno#TAG"></div>
        <div><label>Twitch</label><input name="twitch_login" placeholder="login nebo odkaz"></div>
        <div><label>Kick</label><input name="kick_slug" placeholder="kanál nebo odkaz"></div>
        <div class="full"><label>Štítky (oddělené čárkou)</label><input name="tags" placeholder="comfort picks, agresivní, tiltuje"></div>
        <div class="full"><label>Poznámky</label><textarea name="notes"></textarea></div>
      </div>
      <p class="form-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" data-cancel>Zrušit</button>
        <button type="submit" class="btn btn-primary">Uložit</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { api, esc, initPage, formDialog, logoHtml, loadChampions, champIcon, draftRow, vodLink, fmtDuration, aggregateChampions, championTableHtml } from '/app.js';

    const me = await initPage('teams');
    const teamId = new URLSearchParams(location.search).get('id');
    let team, players = [], allDrafts = [], icons = new Map(), live = {}, editingPlayer = null;
    let queue = new Map(), pools = [];
    let typeFilter = '';
    let champRole = '';
    let champSort = 'g';

    const ROLE_ORDER = ['TOP', 'JUNGLE', 'MID', 'ADC', 'SUPPORT', 'SUB'];
    const ROLE_NAME = { TOP: 'Top', JUNGLE: 'Jungle', MID: 'Mid', ADC: 'Bot', SUPPORT: 'Support', SUB: 'Náhradník' };
    const typeOf = (d) => d.game_type || 'Neznámý';
    const drafts = () => allDrafts.filter((d) => !typeFilter || typeOf(d) === typeFilter);
    const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);
    const num = (n, digits = 1) => n.toFixed(digits).replace('.', ',');
    const kdaRatio = (k, d, a) => num((k + a) / Math.max(d, 1), 2);
    const wrSpan = (wr) => wr === null ? '<span class="muted">–</span>' : `<span class="wrv ${wr >= 55 ? 'good' : wr < 45 ? 'bad' : ''}">${wr} %</span>`;

    // --- tabs ---------------------------------------------------------------
    const tabs = document.getElementById('tabs');
    function showTab(name) {
      for (const b of tabs.querySelectorAll('button')) b.classList.toggle('active', b.dataset.tab === name);
      for (const p of document.querySelectorAll('.tab-panel')) p.hidden = p.dataset.panel !== name;
      history.replaceState(null, '', `?id=${teamId}${name === 'overview' ? '' : `#${name}`}`);
      if (name === 'vods') loadVods();
    }
    tabs.addEventListener('click', (e) => e.target.closest('button[data-tab]') && showTab(e.target.closest('button').dataset.tab));
    document.addEventListener('click', (e) => e.target.closest('[data-goto]') && showTab(e.target.closest('[data-goto]').dataset.goto));

    // --- which side of a game is this team ------------------------------------
    const teamIds = () => new Set(players.map((p) => p.id));
    function ourSide(d) {
      const ids = teamIds();
      const a = d.actions.find((x) => x.action === 'PICK' && ids.has(x.player_id));
      if (a) return a.side;
      return ids.has(d.pov_player_id) ? 'ALLY' : null;
    }
    const other = (side) => (side === 'ALLY' ? 'ENEMY' : 'ALLY');
    function won(d, side) {
      if (!d.result || !side) return null;
      return (side === 'ALLY') === (d.result === 'WIN');
    }
    /** The opposing team: the team most of the other side's linked players belong to. */
    function opponentOf(d, side) {
      const count = new Map();
      for (const a of d.actions) {
        if (a.side !== other(side) || a.action !== 'PICK' || !a.player_team_id || String(a.player_team_id) === String(teamId)) continue;
        const k = a.player_team_id;
        count.set(k, { id: k, name: a.player_team_name, n: (count.get(k)?.n || 0) + 1 });
      }
      return [...count.values()].sort((x, y) => y.n - x.n)[0] || null;
    }

    // --- rendering -------------------------------------------------------------
    function renderHero() {
      document.getElementById('hero').innerHTML = `
        ${logoHtml(team)}
        <div>
          <h1>${esc(team.name)}${team.is_own_team ? ' <span class="badge badge-own">Náš tým</span>' : ''}</h1>
          <div class="muted">${[team.tag && `[${esc(team.tag)}]`, team.tournament && esc(team.tournament), `${players.length} hráčů`].filter(Boolean).join(' · ')}</div>
        </div>`;
    }

    function renderTypeFilter() {
      const counts = new Map();
      for (const d of allDrafts) counts.set(typeOf(d), (counts.get(typeOf(d)) || 0) + 1);
      const opts = [['', 'Vše', allDrafts.length], ...[...counts.entries()].sort((a, b) => b[1] - a[1]).map(([t, n]) => [t, t, n])];
      const el = document.getElementById('type-filter');
      el.hidden = counts.size < 2;
      el.innerHTML = opts.map(([v, label, n]) =>
        `<button data-type="${esc(v)}" class="${v === typeFilter ? 'active' : ''}" aria-pressed="${v === typeFilter}">${esc(label)} (${n})</button>`).join('');
    }

    function renderSummary(list) {
      let w = 0, l = 0, durSum = 0, durN = 0, kills = 0, deaths = 0, pg = 0;
      for (const d of list) {
        const side = ourSide(d);
        const r = won(d, side);
        if (r === true) w++; else if (r === false) l++;
        if (d.duration_s) (durSum += d.duration_s, durN++);
        const ours = d.actions.filter((a) => a.action === 'PICK' && a.side === side && a.kills !== null && a.kills !== undefined);
        if (side && ours.length) {
          pg++;
          for (const a of ours) (kills += a.kills, deaths += a.deaths);
        }
      }
      const wr = pct(w, w + l);
      const rows = [
        ['Hry', list.length],
        ['Bilance', w + l ? `${w} V – ${l} P` : '–'],
        ['Winrate', wrSpan(wr)],
        ['Ø délka hry', durN ? fmtDuration(Math.round(durSum / durN)) : '–'],
        ['Ø zabití / smrti na hru', pg ? `${num(kills / pg)} / ${num(deaths / pg)}` : '–'],
        ['Hry s post-game daty', `${pg} z ${list.length}`],
      ];
      document.getElementById('summary').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    }

    function renderBans(list) {
      const by = new Map(), vs = new Map();
      for (const d of list) {
        const side = ourSide(d);
        if (!side) continue;
        for (const a of d.actions) {
          if (a.action !== 'BAN') continue;
          const m = a.side === side ? by : vs;
          m.set(a.champion, (m.get(a.champion) || 0) + 1);
        }
      }
      const rows = (m) => {
        const top = [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
        return top.length
          ? top.map(([c, n]) => `<tr><td><span class="gchamp">${champIcon(icons, c, 'row')}${esc(c)}</span></td><td class="muted">${n}× · ${pct(n, list.length)} %</td></tr>`).join('')
          : '<tr><td class="muted" colspan="2">Žádné přečtené bany.</td></tr>';
      };
      document.getElementById('bans-by').innerHTML = rows(by);
      document.getElementById('bans-vs').innerHTML = rows(vs);
    }

    function playerStats(p, list) {
      let g = 0, w = 0, l = 0, k = 0, de = 0, as = 0, kn = 0;
      const champs = new Map();
      for (const d of list) {
        const a = d.actions.find((x) => x.action === 'PICK' && x.player_id === p.id);
        if (!a) continue;
        g++;
        const r = won(d, a.side);
        if (r === true) w++; else if (r === false) l++;
        const c = champs.get(a.champion) || { name: a.champion, g: 0, w: 0, l: 0, k: 0, d: 0, a: 0, kn: 0 };
        c.g++;
        if (r === true) c.w++; else if (r === false) c.l++;
        if (a.kills !== null && a.kills !== undefined) {
          kn++; k += a.kills; de += a.deaths; as += a.assists;
          c.kn++; c.k += a.kills; c.d += a.deaths; c.a += a.assists;
        }
        champs.set(a.champion, c);
      }
      return { g, w, l, k, d: de, a: as, kn, champs: [...champs.values()].sort((x, y) => y.g - x.g || y.w - x.w) };
    }

    // --- Streamers Queue ------------------------------------------------------
    const RANK_TIERS = ['iron', 'bronze', 'silver', 'gold', 'platinum', 'emerald', 'diamond', 'master', 'grandmaster', 'challenger'];
    const RANK_DIV = { IV: 0, III: 1, II: 2, I: 3 };
    function rankValue(rank) {
      const m = String(rank || '').match(/^([A-Za-z]+)\s*(IV|III|II|I)?\D*?(\d+)?\s*LP/i) || String(rank || '').match(/^([A-Za-z]+)\s*(IV|III|II|I)?/i);
      const t = m ? RANK_TIERS.indexOf(m[1].toLowerCase()) : -1;
      if (t < 0) return -1;
      const lp = +(m[3] || 0);
      return m[2] ? t * 10000 + RANK_DIV[m[2].toUpperCase()] * 1000 + Math.min(lp, 999) : t * 10000 + Math.min(lp, 9999);
    }
    /** Queue data of a player: linked explicitly, or a queue player with the same nickname (just a suggestion). */
    function queueOf(p) {
      const qk = p.queue_key || String(p.nickname).toLowerCase();
      const q = queue.get(qk);
      return q ? { ...q, linked: !!p.queue_key } : null;
    }
    const bestAccount = (q) => [...(q?.accounts || [])].filter((a) => a.rank).sort((a, b) => rankValue(b.rank) - rankValue(a.rank))[0];
    function queueCell(p) {
      const q = queueOf(p);
      if (!q) return '<span class="muted">–</span>';
      const best = bestAccount(q);
      const opgg = (q.accounts || []).map((a) => `<a class="opgg-mini" href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.riot)}${a.rank ? ' · ' + esc(a.rank) : ''}">${esc(a.region.toUpperCase())}</a>`).join('');
      const link = !q.linked && me.role === 'admin'
        ? ` <button class="link-like muted" data-qlink="${p.id}" data-qkey="${esc(q.key)}" title="Stejný nick v Streamers Queue – propojit">propojit?</button>` : '';
      return `<span class="nowrap"><b class="wrv ${q.wins >= q.losses ? 'good' : 'bad'}">${q.wins}W ${q.losses}L</b>${q.rank ? ` <span class="muted">#${q.rank}</span>` : ''}</span>
        ${best ? `<div class="muted" style="font-size:.78rem">${esc(String(best.rank).replace(/\s*·\s*/, ' '))} ${esc(best.region.toUpperCase())}</div>` : ''}
        <div class="opgg-row">${opgg}${link}</div>`;
    }

    // --- ban suggestions ------------------------------------------------------
    // Score per champion over the team's players: games in drafts (more weight with a good winrate),
    // the coaching champion pool tier (S/A/B), all scaled by how high the player is ranked.
    const TIER_BONUS = { S: 3, A: 2, B: 1 };
    function rankFactor(p) {
      const v = rankValue(bestAccount(queueOf(p))?.rank);
      if (v < 0) return 1;
      const tier = Math.floor(v / 10000);
      return tier >= 7 ? 1.35 : tier === 6 ? 1.2 : tier === 5 ? 1.1 : 1;
    }
    function renderBanSuggestions(list) {
      const box = document.getElementById('ban-box');
      box.hidden = !!team.is_own_team;
      if (team.is_own_team) return;
      const champs = new Map();
      const add = (c, pts, why) => {
        const r = champs.get(c) || { champion: c, score: 0, why: [] };
        r.score += pts; r.why.push(why); champs.set(c, r);
      };
      for (const p of players) {
        if (p.role === 'SUB') continue;
        const rf = rankFactor(p);
        const st = playerStats(p, list);
        const tiers = new Map(pools.filter((x) => x.player_id === p.id).map((x) => [x.champion, x.tier]));
        const seen = new Set();
        for (const c of st.champs) {
          const decided = c.w + c.l;
          const wr = decided ? c.w / decided : 0.5;
          const tier = tiers.get(c.name);
          add(c.name, (c.g * (0.6 + wr) + (TIER_BONUS[tier] || 0)) * rf,
            `<b>${esc(p.nickname)}</b>: ${c.g} ${c.g === 1 ? 'hra' : c.g < 5 ? 'hry' : 'her'}${decided ? ` · ${Math.round(wr * 100)} %` : ''}${tier ? ` · ${tier} tier` : ''}`);
          seen.add(c.name);
        }
        for (const [c, tier] of tiers) {
          if (seen.has(c) || !TIER_BONUS[tier]) continue;
          add(c, TIER_BONUS[tier] * rf, `<b>${esc(p.nickname)}</b>: ${tier} tier v poolu`);
        }
      }
      const top = [...champs.values()].sort((a, b) => b.score - a.score).slice(0, 6);
      const games = list.length;
      document.getElementById('ban-suggest').innerHTML = top.length
        ? `<thead><tr><th>Champion</th><th>Proč</th><th class="num">Skóre</th></tr></thead><tbody>${top.map((r) => `<tr>
            <td><span class="gchamp">${champIcon(icons, r.champion, 'row')}${esc(r.champion)}</span></td>
            <td class="muted">${r.why.join('<br>')}</td>
            <td class="num strong">${r.score.toFixed(1)}</td></tr>`).join('')}</tbody>
            ${games < 5 ? `<tfoot><tr><td colspan="3" class="muted">Jen ${games} ${games === 1 ? 'hra' : 'her'} v datech – ber jako orientační.</td></tr></tfoot>` : ''}`
        : '<tr><td class="muted">Zatím nic: chybí drafty z VODek i champion pool v koučingu.</td></tr>';
    }

    function renderPlayers(list) {
      const sorted = [...players].sort((a, b) => ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role));
      const el = document.getElementById('players');
      if (!sorted.length) {
        el.innerHTML = '<tr><td class="muted">Tým zatím nemá žádné hráče.</td></tr>';
        return;
      }
      el.innerHTML = `
        <thead><tr>
          <th>Role</th><th>Hráč</th><th class="num">Hry</th><th class="num">V–P</th><th class="num">WR</th>
          <th class="num">KDA</th><th class="num">Ø K / D / A</th><th>Nejhranější championi</th><th>Streamers Queue</th><th></th>
        </tr></thead>
        <tbody>${sorted.map((p) => {
          const s = playerStats(p, list);
          const channel = p.twitch_login && live[p.twitch_login] ? ' <span class="live-tag">LIVE</span>' : '';
          const champs = s.champs.slice(0, 5).map((c) =>
            `<span class="gmini" title="${esc(c.name)}: ${c.g} her">${champIcon(icons, c.name, 'row')}<span>${c.g}</span></span>`).join('');
          const more = s.champs.length > 5 ? `<button class="link-like muted" data-goto="champions">+${s.champs.length - 5}</button>` : '';
          return `<tr>
            <td class="role-cell role-${esc(p.role || '')}">${ROLE_NAME[p.role] || '–'}</td>
            <td><a class="pname" href="/player?id=${p.id}">${esc(p.nickname)}</a>${channel}${p.riot_id ? '' : '<div class="warn">Riot ID chybí</div>'}</td>
            <td class="num">${s.g}</td>
            <td class="num muted">${s.w + s.l ? `${s.w}–${s.l}` : '–'}</td>
            <td class="num">${wrSpan(pct(s.w, s.w + s.l))}</td>
            <td class="num strong">${s.kn ? kdaRatio(s.k, s.d, s.a) : '–'}</td>
            <td class="num muted">${s.kn ? `${num(s.k / s.kn)} / ${num(s.d / s.kn)} / ${num(s.a / s.kn)}` : '–'}</td>
            <td><div class="gpools">${champs || '<span class="muted">zatím žádné hry</span>'}${more}</div></td>
            <td>${queueCell(p)}</td>
            <td class="num nowrap">
              <button class="btn btn-small btn-ghost" data-edit="${p.id}">Upravit</button>
              <button class="btn btn-small btn-ghost btn-danger" data-delete="${p.id}" aria-label="Smazat hráče ${esc(p.nickname)}">✕</button>
            </td>
          </tr>`;
        }).join('')}</tbody>`;
    }

    function renderRecent(list) {
      const el = document.getElementById('recent');
      if (!list.length) {
        el.innerHTML = '<tr><td class="muted">Zatím žádné hry. Čtečka je doplní z VODek hráčů, nebo je přidá Claude přes konektor.</td></tr>';
        return;
      }
      el.innerHTML = `
        <thead><tr><th>Datum</th><th>Výsledek</th><th>Soupeř</th><th>Typ</th><th class="num">Délka</th><th>Draft týmu</th><th></th></tr></thead>
        <tbody>${list.slice(0, 10).map((d) => {
          const side = ourSide(d);
          const r = won(d, side);
          const opp = side ? opponentOf(d, side) : null;
          const picks = d.actions.filter((a) => a.action === 'PICK' && a.side === side)
            .sort((x, y) => (x.lane ?? 9) - (y.lane ?? 9) || x.seq - y.seq);
          const when = d.played_at ? new Date(d.played_at).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric' }) : '–';
          const link = vodLink(d.vod_url, d.vod_timestamp_s);
          return `<tr>
            <td class="muted">${when}</td>
            <td>${r === null ? '<span class="muted">–</span>' : r ? '<span class="wrv good">Výhra</span>' : '<span class="wrv bad">Prohra</span>'}</td>
            <td>${opp ? `<a href="/team?id=${opp.id}">${esc(opp.name)}</a>` : '<span class="muted">neznámý</span>'}</td>
            <td class="muted">${esc(typeOf(d))}</td>
            <td class="num muted">${d.duration_s ? fmtDuration(d.duration_s) : '–'}</td>
            <td><div class="gstrip">${picks.map((a) => champIcon(icons, a.champion, 'row')).join('')}</div></td>
            <td class="num">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" title="Champ select ve VODce">VOD ▶</a>` : ''}</td>
          </tr>`;
        }).join('')}</tbody>`;
    }

    function renderDrafts(list) {
      const ours = teamIds();
      document.getElementById('draft-count').textContent = list.length ? `(${list.length})` : '';
      document.getElementById('drafts').innerHTML = list.length
        ? list.map((d) => draftRow(d, icons, ours)).join('')
        : '<div class="empty">Zatím žádné hry. Čtečka je doplní z VODek hráčů, nebo je přidá Claude přes konektor.</div>';
    }

    function renderNotes() {
      document.getElementById('team-notes').textContent = team.notes || 'Žádné poznámky. Přidáš je přes „Upravit tým“.';
    }

    function renderChampions(list) {
      const roles = [['', 'Vše'], ['TOP', 'Top'], ['JUNGLE', 'Jungle'], ['MID', 'Mid'], ['ADC', 'Bot'], ['SUPPORT', 'Support']];
      document.getElementById('champ-roles').innerHTML = roles.map(([r, label]) =>
        `<button data-role="${r}" class="${r === champRole ? 'active' : ''}" aria-pressed="${r === champRole}">${label}</button>`).join('');
      const byId = new Map(players.map((p) => [p.id, p]));
      const picks = [];
      for (const d of list) {
        for (const a of d.actions) {
          if (a.action !== 'PICK' || !byId.has(a.player_id)) continue;
          const p = byId.get(a.player_id);
          if (champRole && p.role !== champRole) continue;
          picks.push({ champion: a.champion, win: won(d, a.side), kills: a.kills, deaths: a.deaths, assists: a.assists, who: p.nickname, played_at: d.played_at });
        }
      }
      const rows = aggregateChampions(picks);
      document.getElementById('champ-count').textContent = rows.length && !champRole ? `(${rows.length})` : '';
      document.getElementById('champs').innerHTML = championTableHtml(rows, icons, { sort: champSort, showWho: true });
    }

    function renderStats() {
      const list = drafts();
      renderTypeFilter();
      renderSummary(list);
      renderBans(list);
      renderBanSuggestions(list);
      renderPlayers(list);
      renderRecent(list);
      renderChampions(list);
      renderDrafts(list);
    }

    let vodsLoaded = false;
    async function loadVods() {
      if (vodsLoaded) return;
      vodsLoaded = true;
      const { vods } = await api(`/api/vods?team_id=${teamId}&limit=24`);
      document.getElementById('team-vods').innerHTML = vods.length
        ? vods.map((v) => `
          <a class="vod" href="${esc(v.url)}" target="_blank" rel="noopener">
            <div class="thumb">${v.thumbnail_url ? `<img src="${esc(v.thumbnail_url)}" alt="" loading="lazy">` : ''}</div>
            <div class="body">
              <div class="title">${esc(v.title || 'Bez názvu')}</div>
              <div class="sub">${esc(v.player_nickname || v.channel_login)} · ${new Date(v.started_at).toLocaleDateString('cs-CZ')}${v.draft_count ? ` · ${v.draft_count} her` : ''}</div>
            </div>
          </a>`).join('')
        : '<div class="empty" style="grid-column:1/-1">Zatím žádné VODky. Doplň hráčům Twitch kanál.</div>';
    }

    async function load() {
      let q;
      ({ team, players, queue: q = [], pools = [] } = await api(`/api/teams/${teamId}`));
      queue = new Map(q.map((x) => [x.key, x]));
      document.title = `${team.name} · SGooBovo šedl scouting`;
      document.body.style.setProperty('--accent', team.accent_color || '#e8b84a');
      let ds;
      [{ drafts: ds }, icons] = await Promise.all([api(`/api/drafts?team_id=${teamId}&limit=100`), loadChampions()]);
      allDrafts = ds;
      if (typeFilter && !allDrafts.some((d) => typeOf(d) === typeFilter)) typeFilter = '';
      renderHero();
      renderNotes();
      renderStats();
    }

    document.getElementById('champ-roles').addEventListener('click', (e) => {
      const b = e.target.closest('[data-role]'); if (!b) return;
      champRole = b.dataset.role; renderChampions(drafts());
    });
    document.getElementById('champs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-sort]'); if (!b) return;
      champSort = b.dataset.sort; renderChampions(drafts());
    });
    document.getElementById('type-filter').addEventListener('click', (e) => {
      const b = e.target.closest('[data-type]'); if (!b) return;
      typeFilter = b.dataset.type; renderStats();
    });

    // --- dialogs -------------------------------------------------------------
    const teamDialog = formDialog(document.getElementById('team-dialog'), {
      async onSubmit(values) {
        await api(`/api/teams/${teamId}`, { method: 'PUT', body: values });
        await load();
      },
    });
    document.getElementById('edit-team').onclick = () => teamDialog.open({ ...team, accent_color: team.accent_color || '#e8b84a' });
    document.getElementById('delete-team').onclick = async () => {
      if (!confirm(`Smazat tým ${team.name}? Hráči zůstanou v databázi bez týmu.`)) return;
      await api(`/api/teams/${teamId}`, { method: 'DELETE' });
      location.href = '/';
    };
    const playerDialogEl = document.getElementById('player-dialog');
    const playerDialog = formDialog(playerDialogEl, {
      async onSubmit(values) {
        if (editingPlayer) await api(`/api/players/${editingPlayer}`, { method: 'PUT', body: values });
        else await api(`/api/teams/${teamId}/players`, { method: 'POST', body: values });
        await load();
      },
    });
    document.getElementById('add-player').onclick = () => {
      editingPlayer = null;
      playerDialogEl.querySelector('[data-title]').textContent = 'Nový hráč';
      playerDialog.open({});
    };
    document.getElementById('players').addEventListener('click', async (e) => {
      const ql = e.target.closest('[data-qlink]');
      if (ql) {
        try { await api('/api/queue/link', { method: 'POST', body: { player_key: ql.dataset.qkey, player_id: +ql.dataset.qlink } }); await load(); }
        catch (err) { alert(err.message); }
        return;
      }
      const btn = e.target.closest('[data-edit], [data-delete]');
      if (!btn) return;
      const id = btn.dataset.edit || btn.dataset.delete;
      const p = players.find((x) => String(x.id) === id);
      if (btn.dataset.edit) {
        editingPlayer = p.id;
        playerDialogEl.querySelector('[data-title]').textContent = `Upravit: ${p.nickname}`;
        playerDialog.open({ ...p, tags: p.tags.join(', ') });
      } else if (confirm(`Smazat hráče ${p.nickname}?`)) {
        await api(`/api/players/${p.id}`, { method: 'DELETE' });
        await load();
      }
    });

    api('/api/live').then((r) => { live = r.twitch; if (players.length) renderPlayers(drafts()); }).catch(() => {});
    load()
      .then(() => { const h = location.hash.slice(1); if (h) showTab(h); })
      .catch((err) => {
        document.querySelector('main').innerHTML = `<div class="empty">${esc(err.message)}<br><br><a href="/">Zpět na týmy</a></div>`;
      });
  </script>
</body>
</html>
