<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue scouting · SGooBovo šedl scouting</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <style>
    .qs-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .qs-tools input[type=search] { max-width: 260px; }
    .qs-tools select { width: auto; }
    .qs-sync { color: var(--muted); font-size: 0.85rem; }
    .qs-table-wrap { overflow-x: auto; border-radius: var(--radius); }
    .qs-table td, .qs-table th { white-space: nowrap; padding: 9px 12px; }
    .qs-table th[data-sort] { cursor: pointer; user-select: none; }
    .qs-table th.sorted { color: var(--text); }
    .qs-table th.sorted::after { content: ' ▾'; color: var(--gold); }
    .qs-table th.sorted.asc::after { content: ' ▴'; }
    .qs-table tbody tr { cursor: pointer; }
    .qs-table tbody tr:hover { background: var(--panel-2); }
    .qs-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .qs-table td.note-td { white-space: normal; min-width: 220px; }
    .qs-table .note-cell { max-width: 380px; color: var(--text-2); font-size: 0.86rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
    .qs-pl { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; color: var(--text); }
    .qs-av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--panel-3); flex: none; display: inline-grid; place-items: center; font-size: 0.7rem; color: var(--muted); }
    .qs-av-lg { width: 64px; height: 64px; font-size: 1.1rem; }
    .win { color: var(--green); }
    .loss { color: #ff7a7e; }
    .zero { color: var(--muted); opacity: .6; }
    .qs-wr { display: inline-flex; align-items: center; gap: 8px; }
    .qs-wr i { display: block; width: 60px; height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
    .qs-wr i b { display: block; height: 100%; }
    .qs-form { display: inline-flex; gap: 3px; vertical-align: middle; }
    .qs-form i { width: 9px; height: 9px; border-radius: 2px; background: var(--green); }
    .qs-form i.l { background: var(--red); }
    .tier { font: 700 0.7rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 5px; background: var(--panel-3); color: var(--muted); margin-left: 6px; }
    .tier-gold { background: rgba(242, 200, 91, .15); color: var(--gold-2); }
    .tier-silver { background: rgba(200, 210, 225, .14); color: #c8d2e1; }
    .tier-bronze { background: rgba(205, 127, 50, .18); color: #e0954f; }
    .tier-prized { background: rgba(198, 166, 255, .16); color: var(--c-other); }
    .roles { display: inline-flex; gap: 3px; }
    .role-t { font: 700 0.7rem var(--display); letter-spacing: .05em; min-width: 34px; padding: 3px 0; text-align: center; border-radius: 6px; border: 1px solid var(--line); background: var(--bg-2); color: #5d6a86; cursor: pointer; }
    .role-t:hover { color: var(--text-2); border-color: var(--line-2); }
    .role-t.on { background: var(--gold); color: var(--on-gold); border-color: transparent; }
    .price { font-weight: 700; color: var(--gold-2); }
    .qs-board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
    .qs-board .card h2 { display: flex; justify-content: space-between; align-items: baseline; }
    .qs-board .card h2 small { color: var(--muted); font: 500 0.8rem var(--font); }
    .qs-rec { list-style: none; margin: 0; padding: 0; }
    .qs-rec li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
    .qs-rec li:last-child { border-bottom: 0; }
    .qs-rec li > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .qs-rec .sub { display: block; color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qs-grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 14px 0; }
    #detail { width: min(920px, calc(100vw - 24px)); max-height: calc(100vh - 40px); }
    #detail .d-body { padding: 22px; }
    .d-hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .d-hero h2 { margin: 0 0 6px; font-size: 1.8rem; }
    .d-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .d-kpis { display: flex; gap: 22px; margin-left: auto; }
    .d-kpis div { text-align: center; }
    .d-kpis b { display: block; font: 700 1.5rem var(--display); }
    .d-kpis span { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    .d-scout { display: grid; grid-template-columns: auto 160px 1fr auto; gap: 12px; align-items: end; margin-top: 18px; padding: 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
    .d-scout textarea { min-height: 42px; }
    .d-hist td { font-size: 0.86rem; }
    .d-hist td.names { white-space: normal; color: var(--muted); min-width: 200px; }
    .lobbies { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
    .lobby header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .lobby header .muted { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
    .lobby .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lobby h4 { margin: 0 0 6px; font: 700 0.85rem var(--display); letter-spacing: .08em; padding-left: 8px; border-left: 3px solid; }
    .lobby .blue h4 { color: var(--blue); }
    .lobby .red h4 { color: var(--red); }
    .lobby .row { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 0.88rem; }
    .lobby .row.fav { color: var(--gold-2); font-weight: 600; }
    .lobby .row small { margin-left: auto; color: var(--muted); }
    .opgg-set { display: inline-flex; gap: 4px; vertical-align: middle; flex-wrap: wrap; }
    .opgg-set .opgg { margin: 0; }
    .duo { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .duo a { color: var(--text); font-weight: 600; }
    .duo .plus { color: var(--muted); }
    .team-tag { font: 700 0.68rem var(--display); letter-spacing: .05em; color: var(--gold-2); border: 1px solid rgba(232,184,74,.45); border-radius: 5px; padding: 0 5px; margin-left: 6px; }
    .d-link { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 12px; padding: 12px 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
    .d-link select { width: auto; }
    .qs-table .opgg-set { flex-wrap: nowrap; }
    .d-hero > div:nth-child(2) { flex: 1; min-width: 260px; }
    .pref { font: 700 0.68rem var(--display); letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; margin-left: 6px; }
    .lolrank { font-weight: 600; }
    .lolrank small { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .acc-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .acc { display: inline-flex; flex-direction: column; padding: 7px 11px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); color: var(--text); font-size: 0.85rem; }
    .acc:hover { border-color: #7d6cf0; text-decoration: none; }
    .acc b { font-weight: 600; }
    .acc span { color: var(--muted); font-size: 0.78rem; }
    .opgg.sug { background: transparent; border: 1px dashed #7d6cf0; color: #b3a8ff; }
    .d-riot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; padding: 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
    .d-riot .sugs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); align-items: center; }
    .d-riot .sugs button { font: 600 0.78rem var(--font); padding: 3px 9px; border-radius: 999px; border: 1px dashed var(--line-2); background: transparent; color: var(--text-2); cursor: pointer; }
    .d-riot .sugs button:hover { border-color: var(--gold); color: var(--gold-2); }
    .opgg { display: inline-block; font: 700 0.7rem var(--display); padding: 2px 7px; border-radius: 5px; background: #5c46e8; color: #fff; margin: 4px 3px 0 0; }
    .opgg:hover { text-decoration: none; filter: brightness(1.15); }
    @media (max-width: 760px) { .d-scout, .d-riot { grid-template-columns: 1fr; } .d-kpis { margin-left: 0; } .lobbies { grid-template-columns: 1fr; } }
    /* ochrana při streamu */
    #shield { position: fixed; inset: 0; z-index: 50; background: #000; display: grid; place-items: center; text-align: center; padding: 24px; }
    #shield[hidden] { display: none; }
    #shield .box { max-width: 460px; }
    #shield h2 { font-size: 1.6rem; margin-bottom: 10px; }
    #shield p { color: var(--muted); margin: 0 0 18px; }
    #watermark { position: fixed; inset: -50%; z-index: 40; pointer-events: none; transform: rotate(-24deg); opacity: .06;
      display: flex; flex-wrap: wrap; gap: 70px 120px; align-content: flex-start; font: 700 1.1rem var(--display); color: var(--text); user-select: none; }
    #watermark[hidden] { display: none; }
    .share-on { background: var(--red) !important; color: #fff !important; border-color: transparent !important; }
  </style>
</head>
<body>
  <main style="max-width: none; padding-left: 28px; padding-right: 28px">
    <div class="page-head">
      <div>
        <h1>Queue scouting</h1>
        <p>Hráči ze Streamers Queue: oficiální W/L, soupeři a spoluhráči z uložených zápasů. Poznámky, oblíbení podle pozic a ceny vidí jen admini.</p>
      </div>
      <div class="page-head-tools">
        <span class="qs-sync" id="sync-info"></span>
        <span class="qs-sync" id="live-info" title="Stránka se sama obnovuje každých 10 s"><span class="live-dot" style="display:inline-block;vertical-align:middle"></span> <span id="tick">auto 10 s</span></span>
        <button class="btn btn-small btn-ghost" id="history" hidden title="Stáhne z Streamers Queue API celou historii zápasů (jednorázově, pak se doplňuje samo)">Načíst historii z API</button>
        <button class="btn btn-small btn-ghost" id="profiles" title="Projde profily hráčů na Streamers Clash a načte jejich účty (OP.GG, rank)">Načíst účty všem</button>
        <button class="btn btn-small" id="sync">Synchronizovat</button>
        <button class="btn btn-small btn-ghost" id="share" title="Zčerná stránku, když sdílíš obrazovku (Discord apod.). Klávesa F9.">Sdílím obrazovku (F9)</button>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button data-tab="players" class="active">Hráči <span class="count" id="c-players"></span></button>
      <button data-tab="favs">Oblíbení podle pozic <span class="count" id="c-favs"></span></button>
      <button data-tab="duos">Dua</button>
      <button data-tab="live">Živě <span class="count" id="c-live"></span></button>
    </nav>

    <section class="tab-panel" data-panel="players">
      <div class="qs-tools">
        <input type="search" id="q" placeholder="Hledat hráče…">
        <div class="seg" id="role-filter"></div>
        <select id="show">
          <option value="all">Všichni</option>
          <option value="fav">Jen oblíbení</option>
          <option value="note">S poznámkou</option>
          <option value="price">S cenou</option>
        </select>
        <label class="qs-sync">Min. zápasů <input type="number" id="min" min="0" value="0" style="width:70px"></label>
      </div>
      <div class="qs-table-wrap">
        <table class="table qs-table">
          <thead><tr id="thead"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="qs-sync" id="foot"></p>
    </section>

    <section class="tab-panel" data-panel="favs" hidden>
      <div class="qs-board" id="favs"></div>
    </section>

    <section class="tab-panel" data-panel="duos" hidden>
      <div class="qs-tools">
        <input type="search" id="duo-q" placeholder="Duo s hráčem…">
        <label class="qs-sync">Min. her spolu
          <select id="duo-min" style="width:auto"><option>2</option><option selected>3</option><option>5</option><option>8</option></select></label>
        <label class="qs-sync" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="duo-fav"> jen s oblíbenými</label>
      </div>
      <div class="qs-grid3" id="duos" style="margin-top:0"></div>
      <p class="qs-sync">Ze sledovaných queue zápasů – kolikrát hráli spolu v jednom týmu a jak to dopadlo. Klik na hráče otevře detail.</p>
    </section>

    <section class="tab-panel" data-panel="live" hidden>
      <div id="live"><p class="empty">Načítám…</p></div>
    </section>
  </main>

  <dialog id="detail"><div class="d-body" id="detail-body"></div></dialog>

  <div id="shield" hidden><div class="box">
    <h2 id="shield-title"></h2>
    <p id="shield-text"></p>
    <button class="btn" id="shield-off" hidden>Zobrazit scouting (F9)</button>
  </div></div>
  <div id="watermark" hidden aria-hidden="true"></div>

  <script type="module">
    import { api, esc, initPage, timeAgo } from '/app.js';

    const me = await initPage('scouting');
    if (me.role !== 'admin') location.href = '/';

    const ROLES = [['TOP', 'TOP'], ['JUNGLE', 'JNG'], ['MID', 'MID'], ['ADC', 'ADC'], ['SUPPORT', 'SUP']];
    const S = { players: new Map(), matches: [], live: [], sort: { col: 'rank', dir: 1 }, q: '', role: '', show: 'all', min: 0, tab: 'players' };
    const $ = (s) => document.querySelector(s);
    const pct = (x) => (x == null || Number.isNaN(x) ? '–' : `${Math.round(x * 100)} %`);
    const k = (n) => String(n).trim().toLowerCase();
    const wl = (r) => `<span><b class="${r.wins ? 'win' : 'zero'}">${r.wins}W</b> <b class="${r.losses ? 'loss' : 'zero'}">${r.losses}L</b></span>`;
    const fmtPrice = (p) => (p == null ? '' : Number(p).toLocaleString('cs-CZ'));

    /* ---------- data ---------- */

    async function load() {
      const data = await api('/api/queue');
      const players = new Map();
      const get = (nick, extra = {}) => {
        const key = k(nick);
        if (!players.has(key)) players.set(key, {
          key, nickname: nick, avatar: null, profile: null, rank: null, tier: null, wins: 0, losses: 0, games: 0, board: false,
          scout: { fav_roles: [], price: null, note: null }, history: [], vs: new Map(), with: new Map(), t: { wins: 0, losses: 0 },
        });
        const p = players.get(key);
        if (!p.avatar && extra.avatar) p.avatar = extra.avatar;
        if (!p.profile && extra.href) p.profile = extra.href;
        return p;
      };
      for (const b of data.players) Object.assign(get(b.nickname), {
        avatar: b.avatar, profile: b.profile, rank: b.rank, tier: b.tier, wins: b.wins, losses: b.losses, games: b.games, board: true,
        elo: b.elo ?? null, last_played: b.last_played ?? null,
        accounts: b.accounts || [], preferred_role: b.preferred_role, profile_checked: !!b.profile_checked_at && b.accounts != null, profile_error: b.profile_error,
      });
      const bump = (map, name, won) => { const r = map.get(k(name)) || { name, wins: 0, losses: 0 }; won ? r.wins++ : r.losses++; map.set(k(name), r); };
      const ordered = [...data.matches].sort((a, b) => (a.number ?? 0) - (b.number ?? 0));
      for (const m of ordered) for (const side of ['blue', 'red']) {
        const team = m[side], enemy = m[side === 'blue' ? 'red' : 'blue'];
        const won = m.winner === side;
        for (const pl of team) {
          const p = get(pl.nickname, pl);
          won ? p.t.wins++ : p.t.losses++;
          p.history.push({ m, side, won, allies: team.filter((x) => x !== pl).map((x) => x.nickname), enemies: enemy.map((x) => x.nickname) });
          for (const e of enemy) bump(p.vs, e.nickname, won);
          for (const a of team) if (a !== pl) bump(p.with, a.nickname, won);
        }
      }
      for (const s of data.scout) { const p = players.get(s.player_key); if (p) p.scout = s; }
      for (const p of players.values()) {
        if (!p.board) { p.wins = p.t.wins; p.losses = p.t.losses; p.games = p.wins + p.losses; }
        p.wr = p.games ? p.wins / p.games : null;
        p.form = p.history.slice(-5).map((h) => h.won);
      }
      S.players = players; S.matches = data.matches; S.suggestions = data.suggestions || {};
      $('#history').hidden = !data.sq_enabled;
      S.links = new Map((data.links || []).map((l) => [l.queue_key, l]));
      S.teams = data.teams || [];
      S.syncedAt = data.synced_at; S.matchCount = data.matches.length; S.lastPoll = Date.now();
      applyStream(data.stream);
      $('#sync-info').textContent = data.synced_at ? `Synchronizováno ${timeAgo(data.synced_at)} · ${data.matches.length} uložených zápasů` : 'Ještě nesynchronizováno';
      $('#c-players').textContent = players.size;
      $('#c-favs').textContent = [...players.values()].filter((p) => p.scout.fav_roles.length).length || '';
      render();
    }

    async function loadLive() {
      const { live, error } = await api('/api/queue/live');
      S.live = live;
      $('#c-live').textContent = live.length || '';
      $('#live').innerHTML = error ? `<p class="empty">Nepodařilo se načíst: ${esc(error)}</p>` : renderLive();
    }

    async function saveScout(p, patch) {
      S.saving = (S.saving || 0) + 1;
      try { return await doSaveScout(p, patch); } finally { S.saving--; }
    }
    async function doSaveScout(p, patch) {
      // posílá jen změněná pole – server zbytek (poznámku, Riot ID…) nechá
      const res = await api(`/api/queue/scout/${encodeURIComponent(p.key)}`, { method: 'PUT', body: patch });
      p.scout = { ...p.scout, ...res.scout, updated_by_name: me.display_name || me.twitch_login, updated_at: new Date().toISOString().slice(0, 19).replace('T', ' ') };
      $('#c-favs').textContent = [...S.players.values()].filter((x) => x.scout.fav_roles.length).length || '';
    }

    /* ---------- hráči ---------- */

    const avatar = (p, cls = '') => p.avatar
      ? `<img class="qs-av ${cls}" src="${esc(p.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
      : `<span class="qs-av ${cls}">${esc(String(p.nickname).slice(0, 2).toUpperCase())}</span>`;
    const wrBar = (wr) => wr == null ? '<span class="zero">–</span>' : `<span class="qs-wr"><i><b style="width:${Math.round(wr * 100)}%;background:${wr >= 0.5 ? 'var(--green)' : 'var(--red)'}"></b></i>${pct(wr)}</span>`;
    const formDots = (f) => f.length ? `<span class="qs-form">${f.map((w) => `<i class="${w ? '' : 'l'}"></i>`).join('')}</span>` : '<span class="zero">–</span>';
    const REG = [['eune', 'EUNE'], ['euw', 'EUW']];
    const ROLE_SHORT = { TOP: 'TOP', JUNGLE: 'JNG', MID: 'MID', ADC: 'ADC', SUPPORT: 'SUP' };
    const opggUrl = (region, riot) => {
      const i = riot.lastIndexOf('#');
      return `https://op.gg/lol/summoners/${region}/${encodeURIComponent(riot.slice(0, i))}-${encodeURIComponent(riot.slice(i + 1))}`;
    };
    const bestSug = (p, region) => (S.suggestions[p.key]?.[region] || [])[0];
    const TIERS = ['iron', 'bronze', 'silver', 'gold', 'platinum', 'emerald', 'diamond', 'master', 'grandmaster', 'challenger'];
    const DIV = { IV: 0, III: 1, II: 2, I: 3 };
    /** "Diamond I · 75 LP" → číslo pro porovnání (Unranked = -1) */
    const rankScore = (rank) => {
      const m = String(rank || '').match(/^([A-Za-z]+)\s*(IV|III|II|I)?\D*?(\d+)?\s*LP/i) || String(rank || '').match(/^([A-Za-z]+)\s*(IV|III|II|I)?/i);
      const t = m ? TIERS.indexOf(m[1].toLowerCase()) : -1;
      if (t < 0) return -1;
      const lp = +(m[3] || 0);
      // Master+ nemá divize, rozhoduje LP (i přes 1000)
      return m[2] ? t * 10000 + DIV[m[2].toUpperCase()] * 1000 + Math.min(lp, 999) : t * 10000 + Math.min(lp, 9999);
    };
    const shortRank = (rank) => String(rank || '').replace(/\s*·\s*/, ' ').replace(/\s*LP$/i, ' LP');
    /** Všechny účty hráče: z profilu na SC + ručně doplněné Riot ID. */
    const accountsOf = (p) => {
      if (!p) return [];
      const list = (p.accounts || []).map((a) => ({ ...a, src: 'profil' }));
      for (const [r] of REG) {
        const id = p.scout?.[`riot_${r}`];
        if (id && !list.some((a) => a.region === r && a.riot.toLowerCase() === id.toLowerCase())) list.push({ region: r, riot: id, rank: null, url: opggUrl(r, id), src: 'ručně' });
      }
      return list;
    };
    /** Proč u hráče není rank: nemá profil / ještě nenačteno / chyba / v profilu nic není. */
    const profileState = (p) => {
      if (!p.profile) return '<span class="zero" title="Nemá propojený profil na Streamers Clash – Riot ID jde doplnit ručně v detailu">bez profilu</span>';
      if (p.profile_error) return `<span class="loss" title="Profil se nepodařilo načíst (${esc(p.profile_error)}) – zkusí se znovu samo, nebo v detailu hráče">⚠ chyba</span>`;
      if (!p.profile_checked) return '<span class="zero" title="Profil ještě nebyl načten">…</span>';
      return '<span class="zero" title="V profilu na SC nejsou žádné účty">–</span>';
    };
    const bestAccount = (p) => accountsOf(p).filter((a) => a.rank).sort((a, b) => rankScore(b.rank) - rankScore(a.rank))[0];
    /** OP.GG odkazy hráče; když v regionu žádný účet není, ale je návrh, ukáže ho čárkovaně. */
    const opggChips = (p, withSug = true) => {
      if (!p) return '';
      const accs = accountsOf(p);
      const count = {};
      const out = accs.map((a) => {
        count[a.region] = (count[a.region] || 0) + 1;
        const label = `${a.region.toUpperCase()}${count[a.region] > 1 ? count[a.region] : ''}`;
        return `<a class="opgg" href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.riot)}${a.rank ? ` · ${esc(a.rank)}` : ''}">${label}</a>`;
      });
      if (withSug) for (const [r, l] of REG) {
        if (accs.some((a) => a.region === r)) continue;
        const sug = bestSug(p, r);
        if (sug) out.push(`<a class="opgg sug" href="${esc(opggUrl(r, sug.riot))}" target="_blank" rel="noopener" title="Návrh: ${esc(sug.riot)} – potvrď v detailu hráče">${l}?</a>`);
      }
      return out.length ? `<span class="opgg-set">${out.join('')}</span>` : '';
    };
    const roleToggles = (p) => `<span class="roles">${ROLES.map(([r, l]) => `<button type="button" class="role-t ${p.scout.fav_roles.includes(r) ? 'on' : ''}" data-role="${r}" data-key="${esc(p.key)}" title="Oblíbený na ${l}">${l}</button>`).join('')}</span>`;

    const ALL_COLS = [
      ['rank', '#', (p, i) => `<span class="zero">${p.rank ?? '–'}</span>`, 'num'],
      ['nickname', 'Hráč', (p) => `<span class="qs-pl">${avatar(p)}${esc(p.nickname)}</span>${p.tier ? `<span class="tier tier-${esc(p.tier)}">${esc(p.tier)}</span>` : ''}${p.preferred_role ? `<span class="pref" title="Preferovaná pozice (profil na SC)">${ROLE_SHORT[p.preferred_role] || esc(p.preferred_role)}</span>` : ''}${teamTag(p)}`],
      ['elo', 'ELO', (p) => (p.elo == null ? '<span class="zero">–</span>' : `<b>${p.elo}</b>`), 'num'],
      ['games', 'Zápasy', (p) => p.games, 'num'],
      ['wins', 'W', (p) => `<span class="win">${p.wins}</span>`, 'num'],
      ['losses', 'L', (p) => `<span class="loss">${p.losses}</span>`, 'num'],
      ['wr', 'Winrate', (p) => wrBar(p.wr), 'num'],
      ['form', 'Forma', (p) => formDots(p.form)],
      ['lol', 'LoL rank', (p) => { const a = bestAccount(p); return a ? `<span class="lolrank" title="${esc(a.riot)}">${esc(shortRank(a.rank))}<small>${a.region.toUpperCase()}</small></span>` : profileState(p); }],
      ['opgg', 'OP.GG', (p) => opggChips(p) || '<span class="zero">–</span>'],
      ['fav', 'Oblíbený na', (p) => roleToggles(p)],
      ['price', 'Cena', (p) => p.scout.price != null ? `<span class="price">${fmtPrice(p.scout.price)}</span>` : '<span class="zero">–</span>', 'num'],
      ['note', 'Poznámka', (p) => `<div class="note-cell" title="${esc(p.scout.note || '')}">${esc(p.scout.note || '')}</div>`, 'note-td'],
    ];
    const sortVal = {
      rank: (p) => p.rank ?? 1e9, nickname: (p) => p.nickname.toLowerCase(), games: (p) => p.games, elo: (p) => p.elo ?? -1e9, wins: (p) => p.wins,
      losses: (p) => p.losses, wr: (p) => p.wr ?? -1, form: (p) => p.form.filter(Boolean).length,
      fav: (p) => p.scout.fav_roles.length, lol: (p) => rankScore(bestAccount(p)?.rank), opgg: (p) => accountsOf(p).length + (p.scout.riot_euw ? 2 : 0) + (bestSug(p, 'eune') || bestSug(p, 'euw') ? 1 : 0), price: (p) => p.scout.price ?? -1, note: (p) => (p.scout.note ? 1 : 0),
    };

    function filtered() {
      const q = S.q.toLowerCase();
      const { col, dir } = S.sort;
      return [...S.players.values()].filter((p) =>
        (!q || p.nickname.toLowerCase().includes(q)) && p.games >= S.min &&
        (!S.role || p.scout.fav_roles.includes(S.role)) &&
        (S.show === 'all' || (S.show === 'fav' && p.scout.fav_roles.length) || (S.show === 'note' && p.scout.note) || (S.show === 'price' && p.scout.price != null)),
      ).sort((a, b) => {
        const va = sortVal[col](a), vb = sortVal[col](b);
        return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * dir || b.wins - a.wins;
      });
    }

    function render() {
      const COLS = ALL_COLS.filter(([c]) => c !== 'elo' || [...S.players.values()].some((p) => p.elo != null));
      $('#thead').innerHTML = COLS.map(([c, l, , cls]) => `<th data-sort="${c}" class="${cls || ''} ${S.sort.col === c ? `sorted ${S.sort.dir > 0 ? 'asc' : ''}` : ''}">${l}</th>`).join('');
      const rows = filtered();
      $('#rows').innerHTML = rows.length
        ? rows.map((p, i) => `<tr data-key="${esc(p.key)}">${COLS.map(([, , fn, cls]) => `<td class="${cls || ''}">${fn(p, i)}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="${COLS.length}" class="empty">Nikdo neodpovídá filtru</td></tr>`;
      $('#foot').textContent = `${rows.length} hráčů · W/L a pořadí z oficiálního žebříčku, forma a detail z uložených zápasů.`;
      renderFavs();
      if (S.tab === 'duos') renderDuos();
    }

    /** Odznak týmu, když je hráč propojený s hráčem v appce. */
    const teamTag = (p) => {
      const l = S.links?.get(p.key);
      return l && l.team_id ? `<span class="team-tag" title="V týmu ${esc(l.team_name)}">${esc(l.team_tag || l.team_name)}</span>` : '';
    };

    /* ---------- dua ---------- */

    function renderDuos() {
      const min = +$('#duo-min').value || 3;
      const q = $('#duo-q').value.trim().toLowerCase();
      const favOnly = $('#duo-fav').checked;
      const pairs = new Map();
      for (const m of S.matches) for (const side of ['blue', 'red']) {
        const team = m[side].map((x) => x.nickname);
        const won = m.winner === side;
        for (let i = 0; i < team.length; i++) for (let j = i + 1; j < team.length; j++) {
          const [a, b] = [team[i], team[j]].sort((x, y) => x.toLowerCase().localeCompare(y.toLowerCase()));
          const id = `${k(a)}|${k(b)}`;
          const r = pairs.get(id) || { a, b, wins: 0, losses: 0 };
          won ? r.wins++ : r.losses++;
          pairs.set(id, r);
        }
      }
      const isFav = (n) => S.players.get(k(n))?.scout.fav_roles.length;
      const list = [...pairs.values()].filter((r) => r.wins + r.losses >= min
        && (!q || r.a.toLowerCase().includes(q) || r.b.toLowerCase().includes(q))
        && (!favOnly || isFav(r.a) || isFav(r.b)));
      const wr = (r) => r.wins / (r.wins + r.losses);
      const name = (n) => `<a href="#" data-open="${esc(k(n))}">${esc(n)}</a>${isFav(n) ? ' ★' : ''}`;
      const block = (title, rows) => `<section class="card"><h2>${title} <small style="color:var(--muted);font:500 .8rem var(--font)">${rows.length}</small></h2>
        ${rows.length ? `<ul class="qs-rec">${rows.slice(0, 15).map((r) => `<li><span class="duo">${name(r.a)}<span class="plus">+</span>${name(r.b)}</span>${wl(r)}<span class="sub" style="min-width:40px;text-align:right">${pct(wr(r))}</span></li>`).join('')}</ul>`
          : '<p class="zero" style="font-size:.88rem">Zatím málo společných her. Sniž minimum nebo počkej, až přibudou zápasy.</p>'}</section>`;
      $('#duos').innerHTML =
        block('Nejlepší dua', [...list].sort((x, y) => wr(y) - wr(x) || (y.wins + y.losses) - (x.wins + x.losses))) +
        block('Nejhorší dua', [...list].sort((x, y) => wr(x) - wr(y) || (y.wins + y.losses) - (x.wins + x.losses))) +
        block('Nejčastěji spolu', [...list].sort((x, y) => (y.wins + y.losses) - (x.wins + x.losses) || wr(y) - wr(x)));
    }
    for (const id of ['#duo-q', '#duo-min', '#duo-fav']) $(id).addEventListener('input', renderDuos);

    /* ---------- oblíbení podle pozic ---------- */

    function renderFavs() {
      $('#favs').innerHTML = ROLES.map(([r, l]) => {
        const list = [...S.players.values()].filter((p) => p.scout.fav_roles.includes(r)).sort((a, b) => (b.wr ?? 0) - (a.wr ?? 0));
        return `<section class="card"><h2>${l} <small>${list.length}</small></h2>
          ${list.length ? `<ul class="qs-rec">${list.map((p) => `<li data-key="${esc(p.key)}" style="cursor:pointer">
            <span><span class="qs-pl">${avatar(p)}${esc(p.nickname)}</span> ${opggChips(p)}${p.scout.note ? `<span class="sub">${esc(p.scout.note)}</span>` : ''}</span>
            <span style="text-align:right">${wl(p)}<span class="sub">${pct(p.wr)}${p.scout.price != null ? ` · <span class="price">${fmtPrice(p.scout.price)}</span>` : ''}</span></span></li>`).join('')}</ul>`
            : '<p class="zero" style="font-size:.88rem">Zatím nikdo. Označ hráče v tabulce.</p>'}</section>`;
      }).join('');
    }

    /* ---------- živě ---------- */

    function renderLive() {
      if (!S.live.length) return '<p class="empty">Teď nikdo nehraje.</p>';
      const row = (pl) => {
        const p = S.players.get(k(pl.nickname));
        const fav = p?.scout.fav_roles.length;
        return `<div class="row ${fav ? 'fav' : ''}" data-key="${esc(k(pl.nickname))}" style="cursor:pointer">${avatar(p || pl)}${esc(pl.nickname)}${fav ? ' ★' : ''} ${opggChips(p, false)}<small>${p ? `${p.wins}W ${p.losses}L` : ''}</small></div>`;
      };
      const team = (l, side) => `<div class="${side}"><h4>${side.toUpperCase()}</h4>${l[side].map(row).join('')}
        ${(l.opgg?.[side] || []).map((o) => `<a class="opgg" href="${esc(o.url)}" target="_blank" rel="noopener">${esc(String(o.server).toUpperCase())} ${o.players}/5</a>`).join('')}</div>`;
      return `<div class="lobbies">${[...S.live].sort((a, b) => b.number - a.number).map((l) => `
        <article class="card lobby"><header><b>#${l.number}</b><span class="badge ${l.state === 'live' ? 'badge-live' : ''}">${l.state === 'live' ? 'hraje se' : 'čeká na start'}</span>
        <span class="muted">${esc(l.day || '')} ${esc(l.time_from || '')}</span></header>
        <div class="teams">${team(l, 'blue')}${team(l, 'red')}</div></article>`).join('')}</div>`;
    }

    /* ---------- detail ---------- */

    const ROLE_OPTS = [['TOP', 'Top'], ['JUNGLE', 'Jungle'], ['MID', 'Mid'], ['ADC', 'ADC'], ['SUPPORT', 'Support'], ['SUB', 'Náhradník']];
    function linkSection(p) {
      const l = S.links?.get(p.key);
      if (l) {
        return `<div class="d-link"><span>V appce: <a href="/player?id=${l.player_id}"><b>${esc(l.nickname)}</b></a>${l.team_id ? ` v týmu <a href="/team?id=${l.team_id}">${esc(l.team_name)}</a>` : ''}</span>
          <span style="flex:1"></span><button type="button" class="btn btn-small btn-ghost" id="d-unlink">Odpojit</button></div>`;
      }
      const role = p.preferred_role || (p.scout.fav_roles.length === 1 ? p.scout.fav_roles[0] : '');
      return `<div class="d-link">
        <label class="field"><span class="field-label">Přidat do týmu v appce</span>
          <select id="d-team">${S.teams.map((t) => `<option value="${t.id}">${esc(t.name)}${t.is_own_team ? ' (náš)' : ''}</option>`).join('')}</select></label>
        <label class="field"><span class="field-label">Role</span>
          <select id="d-role"><option value="">–</option>${ROLE_OPTS.map(([v, l]) => `<option value="${v}" ${v === role ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <button type="button" class="btn" id="d-link" ${S.teams.length ? '' : 'disabled'}>Přidat</button>
        <span class="qs-sync" style="flex-basis:100%">Vytvoří hráče v týmu s Riot ID z jeho profilu na SC. Queue statistiky pak uvidíš i na stránce týmu. Pokud už hráč v týmu je, propoj ho na stránce týmu.</span>
      </div>`;
    }

    function openDetail(key) {
      const p = S.players.get(key);
      if (!p) return;
      const vs = [...p.vs.values()];
      const beat = vs.filter((r) => r.wins).sort((a, b) => b.wins - a.wins || a.losses - b.losses).slice(0, 10);
      const lost = vs.filter((r) => r.losses).sort((a, b) => b.losses - a.losses || a.wins - b.wins).slice(0, 10);
      const mates = [...p.with.values()].sort((a, b) => (b.wins + b.losses) - (a.wins + a.losses) || b.wins - a.wins).slice(0, 12);
      const rec = (list) => list.length ? `<ul class="qs-rec">${list.map((r) => `<li><a href="#" data-open="${esc(k(r.name))}">${esc(r.name)}</a>${wl(r)}</li>`).join('')}</ul>` : '<p class="zero">Zatím nic</p>';
      const tracked = p.t.wins + p.t.losses;
      $('#detail-body').innerHTML = `
        <div class="d-hero">
          ${avatar(p, 'qs-av-lg')}
          <div>
            <h2>${esc(p.nickname)}</h2>
            <div class="d-meta">
              ${p.rank ? `<span class="badge">#${p.rank} v žebříčku</span>` : ''}
              ${p.last_played ? `<span class="chip" title="Poslední hra v queue">hrál ${esc(new Date(p.last_played).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }))}</span>` : ''}
              ${p.tier ? `<span class="tier tier-${esc(p.tier)}" style="margin:0">${esc(p.tier)}</span>` : ''}
              ${p.profile ? `<a class="chip" href="${esc(p.profile)}" target="_blank" rel="noopener">profil na SC ↗</a>` : ''}
              ${p.preferred_role ? `<span class="badge" title="Preferovaná pozice z profilu na SC">pozice: ${ROLE_SHORT[p.preferred_role] || esc(p.preferred_role)}</span>` : ''}
              ${p.profile ? `<button type="button" class="btn btn-small btn-ghost" id="d-profile">${p.profile_checked ? 'Znovu načíst účty' : 'Načíst účty z profilu'}</button>` : ''}
            </div>
            ${accountsOf(p).length ? `<div class="acc-list">${accountsOf(p).map((a) => `<a class="acc" href="${esc(a.url)}" target="_blank" rel="noopener"><b>${esc(a.riot)}</b><span>${a.region.toUpperCase()}${a.rank ? ` · ${esc(a.rank)}` : ''}${a.src === 'ručně' ? ' · ručně' : ''}</span></a>`).join('')}</div>` : ''}
          </div>
          <div class="d-kpis">
            ${p.elo != null ? `<div><b>${p.elo}</b><span>ELO</span></div>` : ''}
            <div><b>${p.games}</b><span>zápasů</span></div>
            <div><b class="win">${p.wins}</b><span>W</span></div>
            <div><b class="loss">${p.losses}</b><span>L</span></div>
            <div><b>${pct(p.wr)}</b><span>winrate</span></div>
          </div>
          <button class="btn btn-icon" id="d-close" title="Zavřít">✕</button>
        </div>

        <form class="d-scout" id="d-form">
          <div class="field"><span class="field-label">Oblíbený na pozici</span>${roleToggles(p)}</div>
          <label class="field"><span class="field-label">Cena</span><input name="price" inputmode="decimal" placeholder="zatím neznámá" value="${p.scout.price ?? ''}"></label>
          <label class="field"><span class="field-label">Poznámka</span><textarea name="note" rows="2" placeholder="Co o něm víme…">${esc(p.scout.note || '')}</textarea></label>
          <button class="btn btn-primary" type="submit">Uložit</button>
          <p class="form-error" id="d-err" style="grid-column:1/-1;margin:0"></p>
          <div class="d-riot" style="grid-column:1/-1;margin:0;padding:0;border:0">
            ${REG.map(([r, l]) => {
              const sugs = (S.suggestions[p.key]?.[r] || []).filter((x) => x.riot !== p.scout[`riot_${r}`]);
              return `<label class="field"><span class="field-label">Doplnit Riot ID ${l} <small style="font-weight:400;color:var(--muted)">(když není v profilu – Jméno#TAG nebo odkaz na op.gg)</small></span>
                <input name="riot_${r}" placeholder="např. Faker#${l}" value="${esc(p.scout[`riot_${r}`] || '')}">
                ${sugs.length ? `<span class="sugs">Návrh: ${sugs.map((x) => `<button type="button" data-fill="riot_${r}" data-val="${esc(x.riot)}" title="${x.source === 'team' ? 'Z týmu v appce' : `V týmu ve ${x.seen} z ${x.of} jeho lobby`}${x.name_match ? ' · jméno sedí' : ''}">${esc(x.riot)}${x.source === 'team' ? ' · tým' : x.of ? ` · ${x.seen}/${x.of}` : ''}</button>`).join('')}</span>` : ''}
              </label>`;
            }).join('')}
          </div>
        </form>
        ${p.scout.updated_at ? `<p class="qs-sync" style="margin:6px 0 0">Naposledy upravil ${esc(p.scout.updated_by_name || 'admin')} ${timeAgo(p.scout.updated_at)}</p>` : ''}

        ${linkSection(p)}

        <p class="qs-sync" style="margin:16px 0 0">Níže z ${tracked} uložených zápasů${tracked < 5 ? ' – zatím málo dat, ber s rezervou' : ''}.</p>
        <div class="qs-grid3">
          <section class="card"><h2>Porazil</h2>${rec(beat)}</section>
          <section class="card"><h2>Prohrál proti</h2>${rec(lost)}</section>
          <section class="card"><h2>Spoluhráči</h2>${rec(mates)}</section>
        </div>
        ${p.history.length ? `<table class="table d-hist"><thead><tr><th>Lobby</th><th>Kdy</th><th>Strana</th><th></th><th>Spoluhráči</th><th>Soupeři</th></tr></thead><tbody>
          ${[...p.history].reverse().slice(0, 30).map((h) => `<tr><td>#${h.m.number ?? ''}</td><td>${esc(h.m.day || '')} ${esc(h.m.time_from || '')}</td>
            <td style="color:var(--${h.side})">${h.side.toUpperCase()}</td><td><b class="${h.won ? 'win' : 'loss'}">${h.won ? 'W' : 'L'}</b></td>
            <td class="names">${h.allies.map(esc).join(', ')}</td><td class="names">${h.enemies.map(esc).join(', ')}</td></tr>`).join('')}
        </tbody></table>` : ''}`;
      const dlg = $('#detail');
      if (!dlg.open) dlg.showModal();
      dlg.scrollTop = 0;
      $('#d-close').onclick = () => dlg.close();
      const linkBtn = $('#d-link'), unlinkBtn = $('#d-unlink');
      if (linkBtn) linkBtn.onclick = async () => {
        linkBtn.disabled = true;
        try {
          await api('/api/queue/link', { method: 'POST', body: { player_key: p.key, team_id: +$('#d-team').value, role: $('#d-role').value || null } });
          await load(); openDetail(p.key);
        } catch (err) { linkBtn.disabled = false; alert(err.message); }
      };
      if (unlinkBtn) unlinkBtn.onclick = async () => {
        if (!confirm('Odpojit queue hráče od hráče v appce? Hráč v týmu zůstane.')) return;
        await api('/api/queue/link', { method: 'POST', body: { player_key: p.key, unlink: true } });
        await load(); openDetail(p.key);
      };
      const reload = $('#d-profile');
      if (reload) reload.onclick = async () => {
        reload.disabled = true; reload.textContent = 'Načítám…';
        try {
          const d = await api(`/api/queue/profile/${encodeURIComponent(p.key)}`, { method: 'POST', body: {} });
          Object.assign(p, { accounts: d.accounts, preferred_role: d.preferred_role ?? p.preferred_role, profile_checked: true, profile_error: null });
          openDetail(p.key); render();
        } catch (err) { reload.textContent = err.message; }
      };
      $('#d-form').onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target;
        const roles = [...f.querySelectorAll('.role-t.on')].map((b) => b.dataset.role);
        try {
          await saveScout(p, { fav_roles: roles, price: f.price.value.trim() === '' ? null : f.price.value, note: f.note.value, riot_eune: f.riot_eune.value, riot_euw: f.riot_euw.value });
          dlg.close();
          render();
        } catch (err) { $('#d-err').textContent = err.message; }
      };
    }

    /* ---------- události ---------- */

    $('#role-filter').innerHTML = [['', 'Vše'], ...ROLES].map(([r, l]) => `<button type="button" data-r="${r}" class="${r === S.role ? 'active' : ''}">${l}</button>`).join('');
    $('#role-filter').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      S.role = b.dataset.r;
      $('#role-filter').querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
      render();
    });
    $('#q').addEventListener('input', (e) => { S.q = e.target.value; render(); });
    $('#show').addEventListener('change', (e) => { S.show = e.target.value; render(); });
    $('#min').addEventListener('input', (e) => { S.min = +e.target.value || 0; render(); });

    $('#tabs').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tab]'); if (!b) return;
      S.tab = b.dataset.tab;
      document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
      document.querySelectorAll('.tab-panel').forEach((p) => (p.hidden = p.dataset.panel !== S.tab));
      if (S.tab === 'live') loadLive();
      if (S.tab === 'duos') renderDuos();
    });

    document.addEventListener('click', async (e) => {
      const th = e.target.closest('th[data-sort]');
      if (th) {
        const c = th.dataset.sort;
        S.sort = { col: c, dir: S.sort.col === c ? -S.sort.dir : (['rank', 'nickname'].includes(c) ? 1 : -1) };
        return render();
      }
      const toggle = e.target.closest('.role-t');
      if (toggle) {
        e.preventDefault(); e.stopPropagation();
        if (toggle.closest('#d-form')) return toggle.classList.toggle('on'); // v detailu se ukládá tlačítkem
        const p = S.players.get(toggle.dataset.key);
        const roles = new Set(p.scout.fav_roles);
        roles.has(toggle.dataset.role) ? roles.delete(toggle.dataset.role) : roles.add(toggle.dataset.role);
        toggle.classList.toggle('on');
        try { await saveScout(p, { fav_roles: [...roles] }); renderFavs(); }
        catch (err) { toggle.classList.toggle('on'); alert(err.message); }
        return;
      }
      const fill = e.target.closest('[data-fill]');
      if (fill) { const input = document.querySelector(`#d-form [name="${fill.dataset.fill}"]`); input.value = fill.dataset.val; input.focus(); return; }
      if (e.target.closest('a.opgg')) return; // odkaz na op.gg neotevírá detail
      const open = e.target.closest('[data-open]');
      if (open) { e.preventDefault(); return openDetail(open.dataset.open); }
      const row = e.target.closest('#rows tr[data-key], .qs-rec li[data-key], .lobby .row[data-key]');
      if (row && S.players.has(row.dataset.key)) openDetail(row.dataset.key);
    });

    $('#sync').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = 'Synchronizuji…';
      try {
        const r = await api('/api/queue/sync', { method: 'POST', body: {} });
        btn.textContent = `+${r.added} zápasů`;
        await load();
        if (S.tab === 'live') loadLive();
      } catch (err) { alert(err.message); btn.textContent = 'Synchronizovat'; }
      finally { setTimeout(() => { btn.disabled = false; btn.textContent = 'Synchronizovat'; }, 2500); }
    });

    /* ---------- načtení účtů všem hráčům ---------- */

    // Celá historie z Streamers Queue API: server ji jen přepošle (~8 MB), stránka ji rozparsuje
    // a posílá zpět po částech, server zápasy uloží a spáruje hráče.
    $('#history').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      if (!confirm('Stáhnout celou historii zápasů ze Streamers Queue API? Je to jednorázové, pak se nové zápasy doplňují samy.')) return;
      btn.disabled = true;
      S.saving = (S.saving || 0) + 1;
      try {
        btn.textContent = 'Aktualizuju hráče…';
        await api('/api/queue/sync', { method: 'POST', body: {} });
        btn.textContent = 'Stahuju historii…';
        const res = await fetch('/api/queue/sq-history', { cache: 'no-store' });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || `HTTP ${res.status}`);
        const raw = await res.json();
        const slim = (p) => ({ id: String(p.id), displayName: p.displayName ?? null, username: p.username ?? null });
        const side = (g, s) => {
          const list = g.teams?.[s]?.players || [];
          return (list.length ? list : (g.players || []).filter((p) => String(p.team || '').toLowerCase() === s)).map(slim);
        };
        const games = (Array.isArray(raw) ? raw : []).filter((g) => g.state === 'ENDED' && g.winner)
          .map((g) => ({ id: g.id, gameNumber: g.gameNumber, state: g.state, winner: g.winner, createdAt: g.createdAt, endedAt: g.endedAt, blue: side(g, 'blue'), red: side(g, 'red') }))
          .sort((a, b) => a.gameNumber - b.gameNumber);
        let done = 0, paired = 0;
        for (let i = 0; i < games.length; i += 150) {
          const chunk = games.slice(i, i + 150);
          const r = await api('/api/queue/import', { method: 'POST', body: { games: chunk, last: i + 150 >= games.length, total: games.length } });
          done += r.stored; paired += r.paired;
          btn.textContent = `Ukládám… ${Math.min(i + 150, games.length)}/${games.length}`;
        }
        btn.textContent = `Hotovo: ${done} zápasů${paired ? `, spárováno ${paired} hráčů` : ''}`;
        S.saving--; await load(); S.saving++;
      } catch (err) {
        btn.textContent = 'Chyba – zkus znovu';
        alert(err.message);
      } finally {
        S.saving--;
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Načíst historii z API'; }, 6000);
      }
    });

    $('#profiles').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      S.saving = (S.saving || 0) + 1; // auto-obnova mezitím nepřekresluje
      const wait = async (sec, why) => {
        for (let s = sec; s > 0; s--) { btn.textContent = `${why} – pokračuju za ${s} s`; await new Promise((r) => setTimeout(r, 1000)); }
      };
      let last = null, slowdowns = 0;
      try {
        for (;;) {
          const r = await api('/api/queue/profiles', { method: 'POST', body: { limit: 10 } });
          last = r;
          btn.textContent = `Načítám účty… ${r.total - r.remaining}/${r.total}`;
          if (r.throttled) {
            // jejich web nás brzdí: počkej a jeď dál, při opakování déle
            if (++slowdowns > 6) break;
            await wait(20 * slowdowns, 'Web Streamers Clash brzdí');
            continue;
          }
          if (!r.remaining || !r.checked) break;
        }
        btn.textContent = last?.errors ? `Hotovo, ${last.errors} se nepodařilo – zkusí se znovu samo` : 'Účty načteny ✓';
        S.saving--; await load(); S.saving++;
      } catch (err) {
        btn.textContent = 'Chyba – zkus znovu';
        alert(err.message);
      } finally {
        S.saving--;
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Načíst účty všem'; }, 6000);
      }
    });

    /* ---------- ochrana při streamu ---------- */
    // Web nepozná, že ho snímá OBS/Discord. Server ale ví, kdo je live na Twitchi: takovému adminovi
    // (bez povolení streamovat) citlivá data vůbec nepošle a stránka zčerná. Pro Discord apod. je ruční
    // přepínač "Sdílím obrazovku" (F9). Vodoznak s loginem vidí všichni bez povolení streamovat.

    const LS_SHARE = 'qs.sharing';
    let sharing = false;
    try { sharing = localStorage.getItem(LS_SHARE) === '1'; } catch {}

    function updateShield() {
      const st = S.stream || {};
      const forced = !!st.hidden;
      const on = forced || sharing;
      $('#shield').hidden = !on;
      if (on && $('#detail').open) $('#detail').close();
      $('#shield-title').textContent = forced ? 'Jsi live na Twitchi' : 'Sdílíš obrazovku';
      $('#shield-text').textContent = forced
        ? 'Během streamu je Queue scouting skrytý a poznámky, ceny ani oblíbení se do prohlížeče vůbec nenačítají. Jakmile stream skončí, stránka se sama zobrazí (do ~1 min).'
        : 'Scouting je skrytý, ať ho omylem neukážeš. Až sdílení ukončíš, zobraz ho tlačítkem nebo klávesou F9.';
      $('#shield-off').hidden = forced;
      $('#share').classList.toggle('share-on', sharing);
      $('#share').textContent = sharing ? 'Sdílím obrazovku – zapnuto (F9)' : 'Sdílím obrazovku (F9)';
    }
    function setSharing(v) {
      sharing = v;
      try { v ? localStorage.setItem(LS_SHARE, '1') : localStorage.removeItem(LS_SHARE); } catch {}
      updateShield();
    }
    function applyStream(st) {
      S.stream = st || { live: false, allowed: true, hidden: false };
      // vodoznak pro ty, kdo nesmí streamovat – kdyby něco uniklo, je vidět odkud
      const wm = $('#watermark');
      wm.hidden = !!S.stream.allowed;
      if (!wm.hidden && !wm.childElementCount) {
        const label = `${me.twitch_login} · ${new Date().toLocaleDateString('cs-CZ')}`;
        wm.innerHTML = Array.from({ length: 160 }, () => `<span>${esc(label)}</span>`).join('');
      }
      updateShield();
    }
    $('#share').addEventListener('click', () => setSharing(!sharing));
    $('#shield-off').addEventListener('click', () => setSharing(false));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F9') { e.preventDefault(); if (!S.stream?.hidden) setSharing(!sharing); }
    });
    updateShield();

    /* ---------- auto-obnova (10 s) ---------- */

    const POLL_MS = 10_000;
    const sameScout = (a, b) => JSON.stringify([a.fav_roles, a.price, a.note, a.riot_eune || null, a.riot_euw || null]) === JSON.stringify([b.fav_roles, b.price, b.note, b.riot_eune || null, b.riot_euw || null]);
    async function poll() {
      if (document.hidden || S.saving) return;
      try {
        const u = await api('/api/queue/updates');
        const wasHidden = S.stream?.hidden;
        applyStream(u.stream);
        if (wasHidden && !u.stream?.hidden) return void (await load()); // stream skončil → načti data zpět
        // nový sync (přibyly zápasy / změnil se žebříček) → načti všechno
        if (u.synced_at !== S.syncedAt || u.matches !== S.matchCount) return void (await load());
        const byKey = new Map(u.scout.map((x) => [x.player_key, x]));
        let changed = false;
        for (const p of S.players.values()) {
          const next = byKey.get(p.key) || { fav_roles: [], price: null, note: null };
          if (!sameScout(p.scout, next)) { p.scout = next; changed = true; }
        }
        S.lastPoll = Date.now();
        if (changed) {
          // otevřený detail nepřepisuj – rozepsanou poznámku by to smazalo
          render();
          $('#c-favs').textContent = [...S.players.values()].filter((p) => p.scout.fav_roles.length).length || '';
        }
        if (S.tab === 'live') loadLive();
      } catch (err) { console.warn('auto-obnova selhala', err); }
    }
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
    setInterval(() => {
      const s = Math.round((Date.now() - (S.lastPoll || Date.now())) / 1000);
      $('#tick').textContent = s < 3 ? 'aktualizováno teď' : `aktualizováno před ${s} s`;
    }, 1000);

    await load();
    // první návštěva: data ještě nejsou → stáhni je hned
    if (!S.players.size) $('#sync').click();
  </script>
</body>
</html>
