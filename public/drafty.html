<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft · SGooBovo šedl scouting</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{var t=localStorage.getItem('sc-theme');if(t&&t!=='default')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/app.css">
  <style>
    main { max-width: 1440px; }
    .db { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }

    /* --- seznam draftů --- */
    .side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 100px); overflow: auto; padding-right: 2px; }
    .side input { width: 100%; }
    .fold { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 12px 8px 2px; }
    .bd { display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; padding: 9px 11px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--text-2); font: inherit; cursor: pointer; }
    .bd:hover { background: var(--panel); color: var(--text); }
    .bd.active { background: var(--panel-2); border-color: var(--line-2); color: var(--text); box-shadow: inset 3px 0 0 var(--gold); }
    .bd b { font-weight: 600; font-size: .93rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
    .bd .sd { flex: none; font: 700 .62rem var(--display); letter-spacing: .05em; padding: 1px 5px; border-radius: 4px; }
    .sd.BLUE { background: rgba(59,130,246,.22); color: var(--blue-text); } .sd.RED { background: rgba(229,72,77,.22); color: var(--red-text); }
    .bd .strip { display: flex; gap: 2px; }
    .bd .strip .champ { width: 20px; height: 20px; border-radius: 4px; }
    .bd .strip .sep { width: 6px; }
    .side .empty-list { color: var(--muted); font-size: .86rem; padding: 8px; }

    /* --- editor --- */
    .head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: end; margin-bottom: 14px; }
    .head label { display: flex; flex-direction: column; gap: 4px; font-size: .74rem; color: var(--muted); font-weight: 600; min-width: 0; }
    .head input, .head select { width: 100%; }
    .head input.title { font: 700 1.15rem var(--display); }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .tools .sp { flex: 1; }
    .state { color: var(--muted); font-size: .82rem; }
    .state.err { color: var(--red-text); }

    .board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .col { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .col.BLUE { border-top: 3px solid var(--blue); } .col.RED { border-top: 3px solid var(--red); }
    .col.ours { box-shadow: 0 0 0 1px var(--gold) inset; }
    .col-h { display: flex; justify-content: space-between; align-items: center; font: 700 1.05rem var(--display); letter-spacing: .04em; }
    .col.BLUE .col-h { color: var(--blue-text); } .col.RED .col-h { color: var(--red-text); }
    .col-h .us { font: 700 .66rem var(--display); background: var(--gold); color: var(--on-gold); padding: 2px 7px; border-radius: 5px; letter-spacing: .06em; }
    .bans { display: flex; gap: 6px; }
    .bans .gap { width: 10px; }
    .slot { position: relative; cursor: pointer; border: 1px dashed var(--line-2); background: var(--bg-2); border-radius: 9px; display: grid; place-items: center; color: var(--muted); font-size: .7rem; }
    .slot:hover { border-color: var(--gold); }
    .slot.on { border: 2px solid var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent); }
    .slot .ord { position: absolute; top: -7px; left: -7px; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text-2); font: 700 .6rem var(--display); border-radius: 99px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 3px; z-index: 1; }
    .slot .x { position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 99px; border: 0; background: var(--red); color: #fff; font-size: .7rem; line-height: 1; cursor: pointer; display: none; z-index: 1; }
    .slot.filled:hover .x { display: block; }
    .slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
    .ban { width: 46px; height: 46px; }
    .ban.filled img { filter: grayscale(1) brightness(.75); }
    .ban.filled::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 46%, rgba(229,72,77,.9) 47% 53%, transparent 54%); border-radius: 8px; pointer-events: none; }
    .picks { display: flex; flex-direction: column; gap: 8px; }
    .pick { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; }
    .pick .slot { width: 58px; height: 58px; }
    .pick .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .pick .line1 { display: flex; gap: 8px; align-items: center; min-width: 0; }
    .pick select { width: auto; min-height: 30px; padding: 2px 6px; font-size: .78rem; }
    .pick .cn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick .who { color: var(--gold-2); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pick .tier { font: 700 .66rem var(--display); padding: 1px 6px; border-radius: 4px; background: var(--panel-3); color: var(--text-2); }
    .pick input.pn { min-height: 30px; padding: 3px 8px; font-size: .8rem; width: 100%; }

    /* --- výběr championa --- */
    .picker { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 12px; }
    .picker-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .picker-h input { flex: 1; min-width: 180px; }
    .picker-h .hint { color: var(--muted); font-size: .84rem; }
    .picker-h .hint b { color: var(--gold-2); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; max-height: 420px; overflow: auto; padding: 4px; }
    .ch { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; color: var(--text-2); font: 500 .68rem var(--font); cursor: pointer; padding: 0; min-width: 0; }
    .ch img { width: 52px; height: 52px; border-radius: 8px; border: 1px solid var(--line); display: block; }
    .ch span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ch:hover img { border-color: var(--gold); }
    .ch.used { opacity: .25; cursor: default; }
    .ch .t { position: absolute; top: -4px; right: 2px; font: 700 .62rem var(--display); background: var(--gold); color: var(--on-gold); border-radius: 4px; padding: 0 4px; }
    .ch .t.L { background: #7dbbff; } .ch .t.C { background: var(--panel-3); color: var(--text-2); }
    .pool-sep { grid-column: 1 / -1; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-top: 4px; }

    .notes { margin-top: 14px; }
    .notes textarea { width: 100%; min-height: 140px; resize: vertical; }
    .blank { padding: 60px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 14px; }

    @media (max-width: 1000px) {
      .db { grid-template-columns: 1fr; }
      .side { position: static; max-height: 260px; }
      .head { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="db">
      <aside class="side" id="side">
        <button type="button" class="btn btn-primary" id="new">+ Nový draft</button>
        <input type="search" id="q" placeholder="Hledat draft nebo championa…">
        <div id="list"></div>
      </aside>
      <section id="editor"><div class="blank">Načítám…</div></section>
    </div>
  </main>

  <script type="module">
    import { api, esc, initPage, timeAgo } from '/app.js';

    const me = await initPage('drafty');
    if (me.role !== 'admin') location.href = '/';

    const ROLES = ['TOP', 'JUNGLE', 'MID', 'ADC', 'SUPPORT'];
    const RL = { TOP: 'TOP', JUNGLE: 'JNG', MID: 'MID', ADC: 'ADC', SUPPORT: 'SUP' };
    // pořadí profi draftu: [strana, typ, index]
    const ORDER = [
      ['blue', 'ban', 0], ['red', 'ban', 0], ['blue', 'ban', 1], ['red', 'ban', 1], ['blue', 'ban', 2], ['red', 'ban', 2],
      ['blue', 'pick', 0], ['red', 'pick', 0], ['red', 'pick', 1], ['blue', 'pick', 1], ['blue', 'pick', 2], ['red', 'pick', 2],
      ['red', 'ban', 3], ['blue', 'ban', 3], ['red', 'ban', 4], ['blue', 'ban', 4],
      ['red', 'pick', 3], ['blue', 'pick', 3], ['blue', 'pick', 4], ['red', 'pick', 4],
    ];
    const ordOf = (side, type, i) => ORDER.findIndex(([s, t, j]) => s === side && t === type && j === i) + 1;
    const emptySide = () => ({ bans: [null, null, null, null, null], picks: ROLES.map((role) => ({ champion: null, role, note: null })) });
    const emptyData = () => ({ blue: emptySide(), red: emptySide() });

    const S = { boards: [], cur: null, active: null, q: '', pq: '', champs: [], icon: new Map(), version: '', teams: [], own: null, timer: 0, saving: false };
    const $ = (s) => document.querySelector(s);

    // --- data ---
    const [champData, teamsRes] = await Promise.all([api('/api/champions').catch(() => ({ champions: [], version: '' })), api('/api/teams')]);
    S.version = champData.version;
    S.champs = [...champData.champions].sort((a, b) => a.name.localeCompare(b.name, 'en'));
    for (const c of S.champs) S.icon.set(c.name, `https://ddragon.leagueoflegends.com/cdn/${S.version}/img/champion/${c.id}.png`);
    S.teams = teamsRes.teams || [];
    const ownTeam = S.teams.find((t) => t.is_own_team);
    if (ownTeam) {
      try {
        const t = await api(`/api/teams/${ownTeam.id}`);
        S.own = { players: t.players || [], pools: t.pools || [] };
      } catch {}
    }

    const img = (name) => (name && S.icon.get(name) ? `<img src="${esc(S.icon.get(name))}" alt="${esc(name)}" loading="lazy">` : '');
    const usedSet = (d) => new Set([...d.blue.bans, ...d.red.bans, ...d.blue.picks.map((p) => p.champion), ...d.red.picks.map((p) => p.champion)].filter(Boolean));
    const playersFor = (role) => (S.own?.players || []).filter((p) => p.role === role);
    const tierOf = (role, champ) => {
      const ids = new Set(playersFor(role).map((p) => p.id));
      const order = 'SABLC';
      return (S.own?.pools || []).filter((x) => ids.has(x.player_id) && x.champion === champ).map((x) => x.tier).sort((a, b) => order.indexOf(a) - order.indexOf(b))[0] || null;
    };

    async function loadList(keepId) {
      const { boards } = await api('/api/draft-boards');
      S.boards = boards;
      const id = keepId ?? S.cur?.id ?? Number(new URLSearchParams(location.hash.slice(1)).get('id')) ?? null;
      const b = S.boards.find((x) => x.id === id) || null;
      if (b && (!S.cur || S.cur.id !== b.id)) select(b.id);
      renderList();
      if (!S.cur) renderEditor();
    }

    // --- seznam ---
    function renderList() {
      const f = S.q.trim().toLowerCase();
      const list = S.boards.filter((b) => !f || [b.name, b.folder, b.notes, ...usedSet(b.data)].some((x) => String(x || '').toLowerCase().includes(f)));
      if (!list.length) { $('#list').innerHTML = `<div class="empty-list">${S.boards.length ? 'Nic nenalezeno.' : 'Zatím žádné drafty. Založ první tlačítkem nahoře.'}</div>`; return; }
      let h = '', last;
      for (const b of list) {
        const fold = b.folder || 'Bez situace';
        if (fold !== last) { h += `<div class="fold">${esc(fold)}</div>`; last = fold; }
        const our = b.our_side === 'RED' ? b.data.red : b.data.blue, their = b.our_side === 'RED' ? b.data.blue : b.data.red;
        const strip = our.picks.map((p) => p.champion ? `<span class="champ">${img(p.champion)}</span>` : '').join('') + '<span class="sep"></span>' + their.picks.map((p) => p.champion ? `<span class="champ">${img(p.champion)}</span>` : '').join('');
        h += `<button type="button" class="bd ${S.cur?.id === b.id ? 'active' : ''}" data-id="${b.id}">
          <b><span class="sd ${b.our_side}">${b.our_side === 'RED' ? 'RED' : 'BLUE'}</span>${esc(b.name)}</b>
          <span class="strip">${strip}</span></button>`;
      }
      $('#list').innerHTML = h;
    }
    $('#list').addEventListener('click', (e) => { const b = e.target.closest('.bd'); if (b) select(Number(b.dataset.id)); });
    $('#q').addEventListener('input', (e) => { S.q = e.target.value; renderList(); });

    function select(id) {
      if (S.timer) { clearTimeout(S.timer); save(); }
      const b = S.boards.find((x) => x.id === id);
      if (!b) return;
      S.cur = structuredClone(b);
      S.active = firstEmpty();
      history.replaceState(null, '', `#id=${id}`);
      renderList();
      renderEditor();
    }

    $('#new').addEventListener('click', async () => {
      const name = `Nový draft ${new Date().toLocaleDateString('cs-CZ')}`;
      const { id } = await api('/api/draft-boards', { method: 'POST', body: { name, folder: S.cur?.folder || null, our_side: 'BLUE', data: emptyData() } });
      await loadList(id);
      select(id);
      setTimeout(() => { $('#f-name')?.select(); }, 0);
    });

    // --- editor ---
    function firstEmpty(after = -1) {
      if (!S.cur) return null;
      const d = S.cur.data;
      for (let k = 1; k <= ORDER.length; k++) {
        const [side, type, i] = ORDER[(after + k) % ORDER.length];
        const v = type === 'ban' ? d[side].bans[i] : d[side].picks[i].champion;
        if (!v) return { side, type, i };
      }
      return null;
    }

    function renderEditor() {
      const c = S.cur;
      if (!c) { $('#editor').innerHTML = `<div class="blank">${S.boards.length ? 'Vyber draft vlevo, nebo založ nový.' : 'Tady si budete chystat drafty na různé situace: picky, bany, kdo co hraje a poznámky. Začni tlačítkem <b>+ Nový draft</b>.'}</div>`; return; }
      const folders = [...new Set(S.boards.map((b) => b.folder).filter(Boolean))];
      const by = c.updated_by_name ? ` · upravil ${esc(c.updated_by_name)} ${timeAgo(c.updated_at)}` : '';
      $('#editor').innerHTML = `
        <div class="head">
          <label>Název<input id="f-name" class="title" maxlength="120" value="${esc(c.name)}"></label>
          <label>Situace / složka<input id="f-folder" list="folders" maxlength="80" placeholder="např. Blue side, Proti Tým Johny" value="${esc(c.folder || '')}"><datalist id="folders">${folders.map((f) => `<option value="${esc(f)}">`).join('')}</datalist></label>
          <label>Naše strana<div class="seg" id="f-side"><button type="button" data-v="BLUE" class="${c.our_side !== 'RED' ? 'active' : ''}">Blue</button><button type="button" data-v="RED" class="${c.our_side === 'RED' ? 'active' : ''}">Red</button></div></label>
          <label>Soupeř<select id="f-opp"><option value="">— žádný —</option>${S.teams.filter((t) => !t.is_own_team).map((t) => `<option value="${t.id}" ${c.opponent_team_id === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
        </div>
        <div class="tools">
          <button type="button" class="btn btn-small" id="t-dup">Duplikovat</button>
          <button type="button" class="btn btn-small" id="t-swap" title="Prohodí picky a bany mezi blue a red">⇄ Prohodit strany</button>
          <button type="button" class="btn btn-small" id="t-clear">Vyčistit</button>
          <button type="button" class="btn btn-small btn-ghost btn-danger" id="t-del">Smazat</button>
          <span class="sp"></span><span class="state" id="state">Ukládá se samo${by}</span>
        </div>
        <div class="board">${['blue', 'red'].map(sideHtml).join('')}</div>
        <div class="picker">
          <div class="picker-h"><input type="search" id="pq" placeholder="Hledat championa…" value="${esc(S.pq)}"><span class="hint" id="hint"></span></div>
          <div class="grid" id="grid"></div>
        </div>
        <div class="notes"><label class="field"><span class="field-label">Poznámky k draftu (plán hry, win condition, na co si dát pozor…)</span>
          <textarea id="f-notes" maxlength="10000" placeholder="Např. hrajeme přes draky, jungler startuje bot, Ahri prio ban…">${esc(c.notes || '')}</textarea></label></div>`;
      renderGrid();
      bindEditor();
    }

    function sideHtml(side) {
      const c = S.cur, d = c.data[side], up = side.toUpperCase(), ours = c.our_side === up;
      const on = (t, i) => S.active && S.active.side === side && S.active.type === t && S.active.i === i ? 'on' : '';
      const ban = (i) => `<div class="slot ban ${d.bans[i] ? 'filled' : ''} ${on('ban', i)}" data-side="${side}" data-type="ban" data-i="${i}" title="${esc(d.bans[i] || 'Ban')}"><span class="ord">${ordOf(side, 'ban', i)}</span>${img(d.bans[i]) || 'BAN'}${d.bans[i] ? '<button type="button" class="x" data-clear>×</button>' : ''}</div>`;
      const picks = d.picks.map((p, i) => {
        const who = ours ? playersFor(p.role).map((x) => x.nickname).join(' / ') : '';
        const tier = ours && p.champion ? tierOf(p.role, p.champion) : null;
        return `<div class="pick">
          <div class="slot ${p.champion ? 'filled' : ''} ${on('pick', i)}" data-side="${side}" data-type="pick" data-i="${i}"><span class="ord">${ordOf(side, 'pick', i)}</span>${img(p.champion) || 'PICK'}${p.champion ? '<button type="button" class="x" data-clear>×</button>' : ''}</div>
          <div class="info">
            <div class="line1"><select data-role="${side}:${i}">${ROLES.map((r) => `<option value="${r}" ${p.role === r ? 'selected' : ''}>${RL[r]}</option>`).join('')}</select>
              <span class="cn">${esc(p.champion || '—')}</span>${tier ? `<span class="tier" title="Tier v champion poolu">${tier}</span>` : ''}${who ? `<span class="who">${esc(who)}</span>` : ''}</div>
            <input class="pn" data-pnote="${side}:${i}" maxlength="200" placeholder="poznámka (např. flex, alternativa…)" value="${esc(p.note || '')}">
          </div></div>`;
      }).join('');
      return `<div class="col ${up} ${ours ? 'ours' : ''}"><div class="col-h"><span>${up} SIDE</span>${ours ? '<span class="us">MY</span>' : '<span class="muted" style="font:500 .8rem var(--font)">soupeř</span>'}</div>
        <div class="bans">${ban(0)}${ban(1)}${ban(2)}<span class="gap"></span>${ban(3)}${ban(4)}</div>
        <div class="picks">${picks}</div></div>`;
    }

    function renderGrid() {
      const c = S.cur, used = usedSet(c.data), f = S.pq.trim().toLowerCase();
      const a = S.active;
      const ours = a && a.type === 'pick' && c.our_side === a.side.toUpperCase();
      const role = ours ? c.data[a.side].picks[a.i].role : null;
      const hint = !a ? 'Klikni na políčko v draftu, které chceš vyplnit.'
        : `Vybíráš: <b>${a.type === 'ban' ? 'ban' : 'pick'} ${ordOf(a.side, a.type, a.i)} · ${a.side.toUpperCase()}${a.type === 'pick' ? ` · ${RL[c.data[a.side].picks[a.i].role]}` : ''}</b>${ours && playersFor(role).length ? ` – nahoře pool hráče ${esc(playersFor(role).map((p) => p.nickname).join(' / '))}` : ''}`;
      $('#hint').innerHTML = hint;
      const list = S.champs.filter((ch) => !f || ch.name.toLowerCase().includes(f) || ch.id.toLowerCase().includes(f));
      const btn = (ch, t) => `<button type="button" class="ch ${used.has(ch.name) ? 'used' : ''}" data-ch="${esc(ch.name)}" ${used.has(ch.name) ? 'disabled' : ''} title="${esc(ch.name)}">${t ? `<span class="t ${t}">${t}</span>` : ''}${img(ch.name)}<span>${esc(ch.name)}</span></button>`;
      let h = '';
      if (role && !f) {
        const order = 'SABLC';
        const pool = list.map((ch) => ({ ch, t: tierOf(role, ch.name) })).filter((x) => x.t).sort((x, y) => order.indexOf(x.t) - order.indexOf(y.t));
        if (pool.length) h += `<div class="pool-sep">Champion pool</div>${pool.map((x) => btn(x.ch, x.t)).join('')}<div class="pool-sep">Všichni championi</div>`;
      }
      h += list.map((ch) => btn(ch, role ? tierOf(role, ch.name) : null)).join('');
      $('#grid').innerHTML = h || '<span class="muted">Nic nenalezeno.</span>';
    }

    function bindEditor() {
      $('#f-name').addEventListener('input', (e) => { S.cur.name = e.target.value; queueSave(); });
      $('#f-folder').addEventListener('input', (e) => { S.cur.folder = e.target.value; queueSave(); });
      $('#f-notes').addEventListener('input', (e) => { S.cur.notes = e.target.value; queueSave(); });
      $('#f-opp').addEventListener('change', (e) => { S.cur.opponent_team_id = Number(e.target.value) || null; queueSave(); });
      $('#f-side').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; S.cur.our_side = b.dataset.v; queueSave(); renderEditor(); });
      $('#pq').addEventListener('input', (e) => { S.pq = e.target.value; renderGrid(); });
      $('#pq').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const first = $('#grid .ch:not(.used)');
        if (first) first.click();
      });
      document.querySelectorAll('[data-role]').forEach((el) => el.addEventListener('change', () => {
        const [side, i] = el.dataset.role.split(':'); S.cur.data[side].picks[i].role = el.value; queueSave(); renderEditor();
      }));
      document.querySelectorAll('[data-pnote]').forEach((el) => el.addEventListener('input', () => {
        const [side, i] = el.dataset.pnote.split(':'); S.cur.data[side].picks[i].note = el.value; queueSave();
      }));
      document.querySelector('.board').addEventListener('click', (e) => {
        const slot = e.target.closest('.slot'); if (!slot) return;
        const side = slot.dataset.side, type = slot.dataset.type, i = Number(slot.dataset.i);
        if (e.target.closest('[data-clear]')) {
          if (type === 'ban') S.cur.data[side].bans[i] = null; else S.cur.data[side].picks[i].champion = null;
          queueSave();
        }
        S.active = { side, type, i };
        renderEditor();
        $('#pq').focus();
      });
      $('#grid').addEventListener('click', (e) => {
        const b = e.target.closest('.ch:not(.used)'); if (!b || !S.active) return;
        const { side, type, i } = S.active;
        if (type === 'ban') S.cur.data[side].bans[i] = b.dataset.ch; else S.cur.data[side].picks[i].champion = b.dataset.ch;
        S.active = firstEmpty(ordOf(side, type, i) - 1);
        S.pq = '';
        queueSave();
        renderEditor();
        $('#pq').focus();
      });
      $('#t-swap').addEventListener('click', () => {
        const d = S.cur.data; S.cur.data = { blue: d.red, red: d.blue }; S.active = firstEmpty(); queueSave(); renderEditor();
      });
      $('#t-clear').addEventListener('click', () => {
        if (!confirm('Vyčistit všechny picky a bany v tomhle draftu?')) return;
        S.cur.data = emptyData(); S.active = firstEmpty(); queueSave(); renderEditor();
      });
      $('#t-dup').addEventListener('click', async () => {
        if (S.timer) { clearTimeout(S.timer); await save(); }
        const c = S.cur;
        const { id } = await api('/api/draft-boards', { method: 'POST', body: { name: `${c.name} (kopie)`, folder: c.folder, our_side: c.our_side, opponent_team_id: c.opponent_team_id, notes: c.notes, data: c.data } });
        await loadList(id); select(id);
      });
      $('#t-del').addEventListener('click', async () => {
        if (!confirm(`Smazat draft „${S.cur.name}“?`)) return;
        clearTimeout(S.timer); S.timer = 0;
        await api(`/api/draft-boards/${S.cur.id}`, { method: 'DELETE' });
        S.cur = null; history.replaceState(null, '', location.pathname);
        await loadList(); renderEditor();
      });
    }

    function setState(t, err = false) { const el = $('#state'); if (el) { el.textContent = t; el.className = `state ${err ? 'err' : ''}`; } }
    function queueSave() { clearTimeout(S.timer); setState('Neuloženo…'); S.timer = setTimeout(save, 700); }
    async function save() {
      S.timer = 0;
      const c = S.cur; if (!c) return;
      if (!String(c.name || '').trim()) { setState('Draft musí mít název.', true); return; }
      S.saving = true; setState('Ukládám…');
      try {
        await api(`/api/draft-boards/${c.id}`, { method: 'PUT', body: { name: c.name, folder: c.folder || null, our_side: c.our_side, opponent_team_id: c.opponent_team_id || null, notes: c.notes || null, data: c.data } });
        const i = S.boards.findIndex((b) => b.id === c.id);
        if (i >= 0) S.boards[i] = { ...structuredClone(c), updated_by_name: me.display_name || me.twitch_login, updated_at: new Date().toISOString().slice(0, 19).replace('T', ' ') };
        renderList();
        setState('Uloženo ✓');
      } catch (err) { setState(`Neuloženo: ${err.message}`, true); }
      finally { S.saving = false; }
    }
    window.addEventListener('beforeunload', (e) => { if (S.timer || S.saving) e.preventDefault(); });
    // změny od ostatních adminů (když zrovna nic neupravuješ)
    setInterval(async () => {
      if (document.hidden || S.timer || S.saving || document.activeElement?.matches('input, textarea, select')) return;
      try {
        const { boards } = await api('/api/draft-boards');
        if (JSON.stringify(boards) === JSON.stringify(S.boards)) return;
        S.boards = boards;
        const fresh = S.cur && boards.find((b) => b.id === S.cur.id);
        if (S.cur && !fresh) { S.cur = null; renderEditor(); }
        else if (fresh && fresh.updated_at !== S.cur.updated_at) { S.cur = structuredClone(fresh); renderEditor(); }
        renderList();
      } catch {}
    }, 15000);

    await loadList();
  </script>
</body>
</html>
