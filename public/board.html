<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riftkit · SGooBovo šedl scouting</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="board" id="board">
    <div class="board-map" id="map-canvas"></div>
    <aside class="board-side">
      <div class="board-title">
        <h1>Riftkit</h1>
        <span class="muted" id="save-state"></span>
      </div>
      <div>
        <label>Co klikání přidá</label>
        <div class="marker-tools" id="marker-tools"></div>
      </div>
      <div class="marker-panel" id="marker-panel"></div>
      <div class="board-actions">
        <button type="button" class="btn" id="fullscreen">⛶ Celá obrazovka</button>
        <button type="button" class="btn" id="save-as">Uložit jako mapu do koučingu</button>
        <button type="button" class="btn btn-danger" id="clear">Vyčistit tabuli</button>
      </div>
      <details class="board-image">
        <summary>Obrázek mapy</summary>
        <p class="muted" id="image-state"></p>
        <label class="btn btn-small" style="display:inline-flex">Nahrát vlastní obrázek<input type="file" id="image-file" accept="image/png,image/jpeg,image/webp" hidden></label>
        <button type="button" class="btn btn-small" id="image-reset" hidden>Vrátit výchozí</button>
        <p class="form-error" id="image-error"></p>
      </details>
      <a href="/coaching" class="muted" style="font-size:.85rem">← zpět do Koučingu</a>
    </aside>
  </div>

  <script type="module">
    import { api, esc, initPage, MARKERS, markersSvg, mapBoxHtml, mapImageSrc } from '/app.js';

    await initPage('coaching');

    let markers = [];
    let tool = 'ward';
    let selected = -1;
    let mapVersion = null;
    let ddVersion = null;
    const canvas = document.getElementById('map-canvas');
    const saveState = document.getElementById('save-state');

    // --- saving: every change is saved shortly after the last edit ---------------------
    let saveTimer = null;
    function scheduleSave() {
      saveState.textContent = 'Ukládám…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await api('/api/coaching/board', { method: 'PUT', body: { markers } });
          saveState.textContent = 'Uloženo';
        } catch (err) {
          saveState.textContent = `Neuloženo: ${err.message}`;
        }
      }, 600);
    }
    // Don't lose the last edit when the tab is closed right after it.
    addEventListener('pagehide', () => {
      if (saveTimer && saveState.textContent === 'Ukládám…') {
        navigator.sendBeacon?.('/api/coaching/board', new Blob([JSON.stringify({ markers })], { type: 'application/json' }));
      }
    });

    // --- drawing --------------------------------------------------------------------------
    function render() {
      canvas.innerHTML = mapBoxHtml(markers, selected, mapImageSrc(mapVersion, ddVersion));
      renderSide();
    }
    const redrawMarkers = () => { canvas.querySelector('.map-svg').outerHTML = markersSvg(markers, selected); };

    function renderSide() {
      document.getElementById('marker-tools').innerHTML = Object.entries(MARKERS)
        .map(([t, d]) => `<button type="button" class="mtool ${tool === t ? 'on' : ''}" data-tool="${t}" title="${d.hint}"><span class="dot-${t}"></span>${d.label}</button>`).join('');
      const m = markers[selected];
      document.getElementById('marker-panel').innerHTML = m
        ? `<div class="mp-head"><span class="dot-${m.type}"></span><b>${MARKERS[m.type].label}</b><span class="muted">vybraná značka</span></div>
           <div style="display:flex;gap:8px"><input id="marker-label" maxlength="60" placeholder="Popisek, např. 3:15" value="${esc(m.label || '')}">
           <button type="button" class="btn btn-small btn-danger" id="marker-delete">Smazat</button></div>`
        : `<p class="muted" style="margin:0;font-size:.85rem">Klikni do mapy pro přidání značky, táhni pro posun, klikni na značku pro popisek. Delete značku smaže.</p>
           <p class="muted" style="margin:6px 0 0;font-size:.8rem">Na mapě: ${markers.length} ${markers.length === 1 ? 'značka' : markers.length >= 2 && markers.length <= 4 ? 'značky' : 'značek'}</p>`;
    }

    let drag = null;
    const posOf = (e) => {
      const r = canvas.querySelector('.map-box').getBoundingClientRect();
      const clamp = (v) => Math.min(100, Math.max(0, v));
      return { x: Math.round(clamp(((e.clientX - r.left) / r.width) * 100) * 10) / 10, y: Math.round(clamp(((e.clientY - r.top) / r.height) * 100) * 10) / 10 };
    };
    canvas.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.map-box')) return;
      e.preventDefault();
      const g = e.target.closest('.mk');
      if (g) {
        selected = Number(g.dataset.i);
        drag = { i: selected, moved: false };
      } else {
        markers.push({ type: tool, ...posOf(e) });
        selected = markers.length - 1;
        drag = { i: selected, moved: true };
      }
      canvas.setPointerCapture(e.pointerId);
      redrawMarkers();
      renderSide();
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!drag) return;
      Object.assign(markers[drag.i], posOf(e));
      drag.moved = true;
      redrawMarkers();
    });
    const endDrag = () => {
      if (!drag) return;
      if (drag.moved) scheduleSave();
      drag = null;
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    const removeSelected = () => {
      if (selected < 0) return;
      markers.splice(selected, 1);
      selected = -1;
      redrawMarkers(); renderSide(); scheduleSave();
    };

    document.querySelector('.board-side').addEventListener('click', (e) => {
      const t = e.target.closest('[data-tool]');
      if (t) { tool = t.dataset.tool; selected = -1; redrawMarkers(); renderSide(); }
      if (e.target.id === 'marker-delete') removeSelected();
    });
    document.querySelector('.board-side').addEventListener('input', (e) => {
      if (e.target.id !== 'marker-label' || !markers[selected]) return;
      const v = e.target.value.trim();
      if (v) markers[selected].label = v; else delete markers[selected].label;
      redrawMarkers(); scheduleSave();
    });
    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, select')) {
        if (e.key === 'Enter' && e.target.id === 'marker-label') { selected = -1; redrawMarkers(); renderSide(); }
        return;
      }
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); }
      if (e.key === 'Escape') { selected = -1; redrawMarkers(); renderSide(); }
    });

    // --- actions ----------------------------------------------------------------------------
    document.getElementById('clear').addEventListener('click', () => {
      if (!markers.length || !confirm('Smazat z tabule všechny značky?')) return;
      markers = []; selected = -1; render(); scheduleSave();
    });
    document.getElementById('fullscreen').addEventListener('click', () => {
      const el = document.getElementById('board');
      if (document.fullscreenElement) document.exitFullscreen();
      else el.requestFullscreen?.().catch(() => {});
    });
    document.getElementById('save-as').addEventListener('click', async () => {
      if (!markers.length) return alert('Tabule je prázdná.');
      const title = prompt('Název mapy (uloží se do Koučingu pod Celý tým):', 'Plán z tabule');
      if (!title?.trim()) return;
      try {
        await api('/api/coaching/maps', { method: 'POST', body: { title, markers, player_id: null } });
        saveState.textContent = `Uloženo jako mapa „${title.trim()}“`;
      } catch (err) {
        alert(err.message);
      }
    });

    // --- own map picture --------------------------------------------------------------------
    function renderImageState() {
      document.getElementById('image-state').textContent = mapVersion
        ? 'Používá se tvůj nahraný obrázek (platí pro všechny mapy v appce).'
        : 'Používá se malá minimapa od Riotu. Nahraj čistý obrázek Riftu ve vysokém rozlišení (bez značek) – použije se všude.';
      document.getElementById('image-reset').hidden = !mapVersion;
    }

    /** Crops to a square, scales down to at most 2048 px and compresses until it fits the ~1.9 MB limit. */
    async function prepareImage(file) {
      const bmp = await createImageBitmap(file);
      const side = Math.min(bmp.width, bmp.height);
      const sx = (bmp.width - side) / 2, sy = (bmp.height - side) / 2;
      for (const size of [Math.min(side, 2048), 1600, 1280]) {
        const c = Object.assign(document.createElement('canvas'), { width: size, height: size });
        c.getContext('2d').drawImage(bmp, sx, sy, side, side, 0, 0, size, size);
        for (const q of [0.9, 0.8, 0.7, 0.6]) {
          const blob = await new Promise((res) => c.toBlob(res, 'image/webp', q));
          const out = blob?.type === 'image/webp' ? blob : await new Promise((res) => c.toBlob(res, 'image/jpeg', q));
          if (out && out.size <= 1_800_000) return out;
        }
      }
      throw new Error('Obrázek se nepodařilo zmenšit pod limit.');
    }
    const toBase64 = (blob) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });

    document.getElementById('image-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      const err = document.getElementById('image-error');
      err.textContent = '';
      if (!file) return;
      try {
        document.getElementById('image-state').textContent = 'Nahrávám…';
        const blob = await prepareImage(file);
        const res = await api('/api/coaching/map-image', { method: 'PUT', body: { mime: blob.type, data: await toBase64(blob) } });
        mapVersion = res.map_version;
        render(); renderImageState();
      } catch (ex) {
        err.textContent = ex.message;
        renderImageState();
      }
    });
    document.getElementById('image-reset').addEventListener('click', async () => {
      if (!confirm('Smazat nahraný obrázek a vrátit malou minimapu od Riotu?')) return;
      await api('/api/coaching/map-image', { method: 'DELETE' });
      mapVersion = null;
      render(); renderImageState();
    });

    const [board, champs] = await Promise.all([api('/api/coaching/board'), api('/api/champions').catch(() => null)]);
    markers = board.markers;
    mapVersion = board.map_version;
    ddVersion = champs?.version ?? null;
    render();
    renderImageState();
  </script>
</body>
</html>
