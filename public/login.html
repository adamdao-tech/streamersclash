<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přihlášení · SC Scouting</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Streamers Clash <span>Scouting</span></h1>
      <p>Drafty, champion pooly a VODky soupeřů na jednom místě.</p>
      <a class="btn btn-twitch" id="login" href="/auth/login">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.3 3 3 6.4v13.5h4.6V22h2.6l2.5-2.1h3.7l5-4.9V3zm15.9 11.2-2.9 2.8h-4.6l-2.5 2.1V17H6.4V4.7h13.8zM16.9 8.2v5h-1.7v-5zm-4.6 0v5h-1.7v-5z"/></svg>
        Přihlásit přes Twitch
      </a>
      <div id="error" class="alert" hidden></div>
    </div>
  </div>
  <script>
    const messages = {
      not_allowed: 'Tvůj Twitch účet nemá přístup. Požádej admina, ať tě přidá.',
      denied: 'Přihlášení bylo zrušeno.',
      state: 'Přihlášení vypršelo, zkus to znovu.',
      failed: 'Přihlášení přes Twitch selhalo, zkus to znovu.',
      config: 'Server nemá nastavený TWITCH_CLIENT_SECRET.',
    };
    const params = new URLSearchParams(location.search);
    const next = params.get('next');
    if (next) document.getElementById('login').href = '/auth/login?next=' + encodeURIComponent(next);
    const code = params.get('error');
    if (code) {
      const el = document.getElementById('error');
      el.textContent = messages[code] || 'Něco se pokazilo.';
      el.hidden = false;
    }
  </script>
</body>
</html>
